<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>智法通 · AI法律咨询助手</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --navy:#0f2847; --navy2:#16365f; --blue:#1e5fbf; --blue2:#2f80ed;
    --gold:#c8a45c; --gold2:#e6c886; --cyan:#22b8cf;
    --ink:#1f2a3d; --ink2:#5b6b84; --ink3:#8a98ad;
    --bg:#f2f5fa; --card:#ffffff; --line:#e6ebf3;
    --red:#d64545; --green:#1a9e6e; --orange:#e8873a;
  }
  html,body{height:100%}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#0c1c33;color:var(--ink);display:flex;justify-content:center}
  .phone{width:100%;max-width:460px;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden;padding-bottom:76px;box-shadow:0 0 40px rgba(0,0,0,.35)}
  img{display:block;max-width:100%}
  .press{transition:transform .08s;cursor:pointer}.press:active{transform:scale(.96)}

  /* ===== 顶部品牌区 ===== */
  .hero{background:linear-gradient(150deg,#0f2847 0%,#16365f 55%,#1e5088 100%);color:#fff;padding:18px 18px 26px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(200,164,92,.28),transparent 70%)}
  .hero::before{content:"";position:absolute;left:-40px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(47,128,237,.25),transparent 70%)}
  .hero-top{display:flex;align-items:center;gap:10px;position:relative;z-index:2}
  .logo-ic{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;font-size:20px;flex:none}
  .hero-top b{font-size:19px;letter-spacing:2px}
  .hero-top small{display:block;font-size:11px;color:rgba(255,255,255,.65);letter-spacing:1px;font-weight:400}
  .hero-badge{margin-left:auto;font-size:11px;border:1px solid rgba(200,164,92,.6);color:var(--gold2);padding:3px 10px;border-radius:999px}
  .hero h2{position:relative;z-index:2;font-size:21px;margin:18px 0 6px;letter-spacing:1px}
  .hero p{position:relative;z-index:2;font-size:13px;color:rgba(255,255,255,.78);line-height:1.6}
  .hero-search{position:relative;z-index:2;margin-top:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:12px 14px;font-size:14px;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:8px;backdrop-filter:blur(4px)}
  .hero-search .ph{flex:1;opacity:.75}
  .hero-search .go{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1f08;font-weight:800;font-size:13px;padding:6px 14px;border-radius:8px}

  /* ===== 通用分区 ===== */
  .sect{margin:18px 14px 0}
  .sect-head{display:flex;align-items:center;gap:7px;margin-bottom:11px}
  .sect-head .bar{width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--gold),var(--gold2))}
  .sect-head b{font-size:16px;color:var(--navy)}
  .sect-head .more{margin-left:auto;font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:2px}

  /* ===== 双模式入口 ===== */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:16px 14px 0}
  .mode{border-radius:14px;padding:16px 14px;color:#fff;position:relative;overflow:hidden;min-height:128px;display:flex;flex-direction:column}
  .mode.m1{background:linear-gradient(145deg,#1e5fbf,#2f80ed)}
  .mode.m2{background:linear-gradient(145deg,#8a5a17,#c8a45c)}
  .mode .mic{font-size:26px}
  .mode b{font-size:16px;margin-top:8px;letter-spacing:1px}
  .mode span{font-size:11.5px;opacity:.88;margin-top:4px;line-height:1.5;flex:1}
  .mode .mbtn{margin-top:10px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:8px;text-align:center;font-size:12.5px;font-weight:700;padding:7px 0}

  /* ===== 卡片通用 ===== */
  .card{background:var(--card);border-radius:14px;box-shadow:0 3px 14px rgba(20,40,80,.06)}
  .field-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 14px}
  .field{background:#fff;border-radius:12px;padding:13px 4px;text-align:center;box-shadow:0 3px 12px rgba(20,40,80,.05)}
  .field .fic{font-size:24px}
  .field span{display:block;font-size:11.5px;color:var(--ink2);margin-top:5px}

  /* ===== 案例卡 ===== */
  .case-card{padding:15px;margin-bottom:12px;position:relative;border-left:4px solid var(--gold)}
  .case-tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:5px;background:#f6efdd;color:#8a6420;font-weight:700;margin-bottom:8px}
  .case-card h4{font-size:15.5px;color:var(--navy);line-height:1.5}
  .case-card p{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .case-meta{display:flex;align-items:center;gap:10px;margin-top:11px;font-size:11.5px;color:var(--ink3)}
  .case-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--ink3)}
  .case-card .open{position:absolute;right:14px;bottom:13px;font-size:12px;color:var(--blue);font-weight:700}
  .case-card.real{border-left-color:var(--red)}
  .case-card.real .case-tag{background:#fdeaea;color:#b33}

  /* ===== 底部 Tab ===== */
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;height:64px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(20,40,80,.05)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--ink3)}
  .tab .tic{font-size:21px;line-height:1}
  .tab.on{color:var(--blue);font-weight:700}

  /* ===== 页面切换 ===== */
  .page{display:none}.page.on{display:block;animation:fade .2s}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ===== 子页头部 ===== */
  .sub-head{background:linear-gradient(140deg,#0f2847,#1e5088);color:#fff;padding:16px 16px 18px;display:flex;align-items:center;gap:10px}
  .sub-head .back{font-size:20px;width:30px;cursor:pointer}
  .sub-head h3{font-size:17px;letter-spacing:1px}
  .sub-head small{font-size:11px;color:rgba(255,255,255,.6);display:block;font-weight:400;margin-top:2px}

  /* ===== 问答页 ===== */
  .chat-box{padding:14px 12px 16px;min-height:calc(100vh - 64px);display:flex;flex-direction:column}
  .msg{max-width:84%;padding:11px 14px;border-radius:13px;font-size:13.5px;line-height:1.75;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
  .msg.ai{background:#fff;border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start;box-shadow:0 2px 8px rgba(20,40,80,.05)}
  .msg.me{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-top-right-radius:4px;align-self:flex-end}
  .msg.ai .law{margin-top:9px;background:#f4f8ff;border-left:3px solid var(--blue2);padding:8px 10px;border-radius:0 8px 8px 0;font-size:12px;color:var(--ink2);line-height:1.7;white-space:normal}
  .msg.ai .law b{color:var(--blue)}
  .msg.ai .acts{margin-top:9px;background:#fbf7ee;border-left:3px solid var(--gold);padding:8px 10px;border-radius:0 8px 8px 0;font-size:12px;color:#6d5526;line-height:1.7;white-space:normal}
  .quick{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px;align-self:flex-start}
  .quick span{font-size:12px;background:#fff;border:1px solid #cdddf2;color:var(--blue);padding:6px 12px;border-radius:999px}
  .chat-input{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:#fff;border-top:1px solid var(--line);padding:9px 12px;display:flex;gap:8px;z-index:55}
  .chat-input input{flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:14px;outline:none;background:var(--bg)}
  .chat-input input:focus{border-color:var(--blue2)}
  .chat-input button{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:none;border-radius:999px;padding:0 20px;font-size:14px;font-weight:700}
  .typing{display:inline-flex;gap:4px;align-items:center;color:var(--ink3);font-size:13px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .chat-body{flex:1;padding-bottom:70px}

  /* ===== 案例详情 ===== */
  .detail{background:#fff;margin:0;border-radius:0}
  .detail-pad{padding:18px 16px 40px}
  .detail h1{font-size:19px;color:var(--navy);line-height:1.5}
  .detail .info-line{font-size:12px;color:var(--ink3);margin:10px 0 4px}
  .detail h2{font-size:16px;color:var(--navy);margin:24px 0 10px;padding-left:10px;border-left:4px solid var(--gold);line-height:1.4}
  .detail h3{font-size:14.5px;color:var(--ink);margin:16px 0 7px}
  .detail p{font-size:14px;line-height:1.9;color:#33415a;margin-bottom:10px}
  .detail ol,.detail ul{margin:0 0 12px 20px}
  .detail li{font-size:14px;line-height:1.9;color:#33415a;margin-bottom:5px}
  .detail strong{color:var(--navy)}
  .detail table{width:100%;border-collapse:collapse;margin:10px 0 16px;font-size:12.5px;display:block;overflow-x:auto}
  .detail th,.detail td{border:1px solid var(--line);padding:8px 10px;text-align:left;line-height:1.6;min-width:90px}
  .detail th{background:#f4f7fc;color:var(--navy);white-space:nowrap}
  .detail hr{border:none;border-top:1px dashed var(--line);margin:20px 0}
  .quote-box{background:linear-gradient(135deg,#f4f8ff,#fafcff);border:1px solid #dce8fa;border-radius:12px;padding:14px 16px;margin:12px 0;font-size:13px;line-height:1.8;color:#33415a;white-space:pre-wrap}
  .risk-box{background:#fdf3f3;border:1px solid #f3d4d4;border-radius:12px;padding:14px 16px;margin:12px 0}
  .risk-box b{color:var(--red);font-size:13.5px}
  .concl-box{background:linear-gradient(135deg,#fbf7ee,#fdfbf5);border:1px solid #e8d9b4;border-radius:12px;padding:15px 16px;margin:14px 0;font-size:13.5px;line-height:1.9;color:#5c4a22}
  .disclaimer{background:#f6f8fb;border-radius:10px;padding:12px 14px;font-size:11.5px;color:var(--ink3);line-height:1.7;margin-top:22px}

  /* ===== 工具页 ===== */
  .tool-list{padding:14px}
  .tool-item{display:flex;align-items:center;gap:13px;padding:16px;background:#fff;border-radius:14px;margin-bottom:11px;box-shadow:0 3px 12px rgba(20,40,82,.05)}
  .tool-item .ticon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none}
  .tool-item .t1{background:linear-gradient(135deg,#e8f0fe,#d4e4fb)}
  .tool-item .t2{background:linear-gradient(135deg,#fdf2e2,#f8e2c4)}
  .tool-item .t3{background:linear-gradient(135deg,#e6f7f0,#cdeede)}
  .tool-item .t4{background:linear-gradient(135deg,#f3edfc,#e4d7f7)}
  .tool-item b{font-size:14.5px;color:var(--navy);display:block}
  .tool-item span{font-size:12px;color:var(--ink2);margin-top:3px;display:block}
  .tool-item .arr{margin-left:auto;color:var(--ink3);font-size:18px}

  /* ===== 计算器弹层 ===== */
  .sheet-mask{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:80;display:none;align-items:flex-end;justify-content:center}
  .sheet-mask.on{display:flex}
  .sheet{width:100%;max-width:460px;background:#fff;border-radius:20px 20px 0 0;padding:20px 18px 28px;max-height:86vh;overflow-y:auto;animation:up .25s}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet h3{font-size:17px;color:var(--navy);margin-bottom:16px;display:flex;align-items:center}
  .sheet h3 .x{margin-left:auto;font-size:22px;color:var(--ink3);cursor:pointer;line-height:1}
  .field-row{margin-bottom:14px}
  .field-row label{display:block;font-size:13px;color:var(--ink2);margin-bottom:7px;font-weight:600}
  .field-row input,.field-row select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;outline:none;background:var(--bg)}
  .field-row input:focus,.field-row select:focus{border-color:var(--blue2)}
  .seg{display:flex;gap:8px}
  .seg label{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 0;text-align:center;font-size:13px;color:var(--ink2);background:var(--bg);font-weight:400;margin:0;cursor:pointer}
  .seg input{display:none}
  .seg input:checked+span{color:#fff}
  .seg label:has(input:checked){background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:var(--blue);color:#fff;font-weight:700}
  .calc-btn{width:100%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:800;margin-top:6px;letter-spacing:2px}
  .calc-result{margin-top:16px;background:linear-gradient(135deg,#0f2847,#1e5088);color:#fff;border-radius:14px;padding:18px;display:none}
  .calc-result.on{display:block}
  .calc-result .big{font-size:28px;font-weight:900;color:var(--gold2);margin:6px 0 4px}
  .calc-result small{font-size:12px;color:rgba(255,255,255,.7);line-height:1.7;display:block}
  .calc-result .det{margin-top:12px;border-top:1px solid rgba(255,255,255,.18);padding-top:10px;font-size:12.5px;color:rgba(255,255,255,.85);line-height:2}

  /* ===== 法规速查 ===== */
  .law-search{padding:14px 14px 0}
  .law-search input{width:100%;border:1px solid var(--line);border-radius:999px;padding:11px 18px;font-size:14px;outline:none}
  .law-cat{display:flex;gap:8px;padding:12px 14px;overflow-x:auto}
  .law-cat span{flex:none;font-size:12.5px;padding:6px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink2)}
  .law-cat span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .law-item{background:#fff;border-radius:12px;padding:14px 16px;margin:0 14px 10px;box-shadow:0 2px 10px rgba(20,40,82,.05)}
  .law-item b{font-size:14px;color:var(--navy);display:block;line-height:1.5}
  .law-item .law-no{font-size:11.5px;color:var(--gold);font-weight:700;margin:3px 0 6px;display:block}
  .law-item p{font-size:12.5px;color:var(--ink2);line-height:1.75}
  .law-empty{text-align:center;color:var(--ink3);font-size:13px;padding:40px 0}

  /* 数据看板 */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 14px 0}
  .stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 6px;text-align:center;color:#fff}
  .stat b{font-size:18px;color:var(--gold2);display:block}
  .stat span{font-size:10.5px;color:rgba(255,255,255,.7)}

  /* 双模式选择弹层（大问题） */
  .mode-tip{font-size:11.5px;color:var(--ink3);line-height:1.7;background:#f6f8fb;border-radius:8px;padding:9px 12px;margin-bottom:10px}
  .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(15,30,55,.92);color:#fff;padding:12px 22px;border-radius:10px;font-size:13.5px;z-index:200;display:none;max-width:80%}

  /* ===== 专题提交表单 ===== */
  .topic-form{padding:14px 14px 30px}
  .topic-form .card{padding:18px 16px;margin-bottom:14px}
  .topic-form label{display:block;font-size:13px;color:var(--navy);font-weight:700;margin-bottom:8px}
  .topic-form label em{color:var(--red);font-style:normal;margin-left:3px}
  .topic-form input[type=text],.topic-form input[type=number],.topic-form select,.topic-form textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;outline:none;background:var(--bg);font-family:inherit;color:var(--ink)}
  .topic-form textarea{min-height:96px;resize:vertical;line-height:1.7}
  .topic-form input:focus,.topic-form select:focus,.topic-form textarea:focus{border-color:var(--blue2);background:#fff}
  .topic-form .hint{font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.6}
  .ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .ev-grid label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:400;color:var(--ink2);
    border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin:0;background:var(--bg)}
  .ev-grid label:has(input:checked){background:#eef4ff;border-color:var(--blue2);color:var(--blue);font-weight:600}
  .ev-grid input{accent-color:var(--blue)}
  .agree-row{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--ink2);line-height:1.7;margin:6px 0 4px}
  .agree-row input{margin-top:3px;accent-color:var(--blue)}
  .my-topic{border-left-color:var(--cyan)!important}
  .my-topic .case-tag{background:#e3f6f8!important;color:#0f7684!important}
  .mine-actions{display:flex;gap:8px;margin-top:10px}
  .mine-actions span{font-size:11.5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
  .mine-actions span.del{color:var(--red);border-color:#f0caca}
  .section-sub{font-size:12px;color:var(--ink3);margin:2px 0 10px}

  /* ===== 专题访谈聊天 ===== */
  .iv-progress{position:sticky;top:0;z-index:30;background:linear-gradient(140deg,#0f2847,#1e5088);padding:0 16px 12px}
  .iv-bar{height:5px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:2px}
  .iv-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .3s}
  .iv-meta{font-size:11px;color:rgba(255,255,255,.75);margin-top:7px;display:flex;justify-content:space-between}
  .msg.ai .chipset{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .msg.ai .cchip{font-size:12.5px;border:1px solid #cdddf2;background:#f4f8ff;color:var(--blue);padding:7px 13px;border-radius:999px;cursor:pointer}
  .msg.ai .cchip.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
  .msg.ai .cchip.go{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1f08;border:none;font-weight:800}
  .stmt-card{margin-top:10px;border:1px solid #e2d3a6;border-radius:12px;overflow:hidden}
  .stmt-card .stmt-head{background:linear-gradient(135deg,#fbf7ee,#f5ecd4);padding:10px 13px;font-size:12.5px;font-weight:800;color:#7a5a18;display:flex;align-items:center;gap:6px}
  .stmt-card .stmt-body{padding:12px 13px;font-size:12.5px;color:#4a5468;line-height:1.85;white-space:pre-wrap;max-height:340px;overflow-y:auto;background:#fffdf7}
  .stmt-card .stmt-acts{display:flex;gap:8px;padding:10px 13px;background:#fff;border-top:1px solid #f0e8d2}
  .stmt-card .stmt-acts span{flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:9px 0;border-radius:8px;cursor:pointer}
  .stmt-card .stmt-acts .ok{background:linear-gradient(135deg,#0f2847,#1e5088);color:#fff}
  .stmt-card .stmt-acts .no{border:1px solid var(--line);color:var(--ink2)}
  .stmt-title{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;margin:10px 13px 0;width:calc(100% - 26px)}
  .pub-card{border-left-color:var(--green)!important}
  .pub-card .case-tag{background:#e4f6ee!important;color:#0c7a52!important}
  .publish-btn{flex:1;background:linear-gradient(135deg,#138a5f,#1ab37a);color:#fff;text-align:center;font-size:13.5px;font-weight:800;padding:11px 0;border-radius:10px;cursor:pointer}
  .published-btn{flex:1;background:#eef7f2;color:#0c7a52;border:1px solid #bfe6d4;text-align:center;font-size:13.5px;font-weight:700;padding:11px 0;border-radius:10px}
  .chat-input .iv-send{background:linear-gradient(135deg,#c8a45c,#e6c886);color:#2a1f08}

  html:`
  <p class="info-line">委托人：业主（武汉青山区某小区）　｜　争议相对方：开发商 / 装修公司 / 物业公司　｜　整理日期：2026年11月</p>

  <h2>一、事实经过</h2>
  <ol>

  <h2>二、法律依据</h2>
  <h3>（一）开发商保修义务是法定的，不能因装修而免除</h3>
  <p><strong>1. 卫生间防渗漏最低保修期为 5 年。</strong>根据《房屋建筑工程质量保修办法》第七条，有防水要求的卫生间、房间和外墙面的防渗漏，最低保修期限为 <strong>5 年</strong>，自工程竣工验收合格之日起计算。该保修义务是强制性法定责任。</p>
  <p><strong>2. 法定保修义务不能通过约定或业主装修行为排除。</strong>福建省高级人民法院在黄某、郑某诉某房地产公司案中明确：房地产开发企业负有的保修义务系法律规定的、关系住房安全和民生基本需求的强制性义务，不能通过当事人意思自治排除；<strong>即使业主出具了免责承诺书，法院仍认定承诺无效，开发商仍须承担保修责任</strong>。开发商连"业主签了免责承诺书"都不能免责，更何况仅因业主进行了正常装修。</p>
  <p><strong>3. 举证责任在开发商，不在业主。</strong>上述判例中，法院认定开发商担责的关键理由之一是：在案证据不足以证明业主装修中存在导致渗水的不当使用行为。开发商若主张"是装修破坏的"，应由开发商举证。本案回填层无水、可见管无破损、问题指向楼板内暗埋管段——该段管子装修公司物理上无法接触，开发商举证不能，免责主张不能成立。</p>
  <h3>（二）关于"未做回填前闭水试验"这一瑕疵</h3>
  <p>装修公司未做回填前闭水试验，确属施工程序瑕疵，但该瑕疵与"楼板内暗埋管段漏水"之间<strong>没有因果关系</strong>。闭水试验是检测手段，不是保护措施；没做检测不等于管子是装修公司弄坏的。楼板内管段装修公司根本碰不到，开发商的免责主张在物理上不成立。</p>
  <h3>（三）关于楼下邻居的索赔路径</h3>
  <p>楼下（2楼）受损，首先主张权利的对象是楼上业主（3楼），依据是相邻关系或侵权责任。业主赔付后，可再依据保修合同向开发商追偿，或依据装修合同向装修公司追偿。2楼不能跳过楼上业主直接起诉开发商，这是两个不同的法律关系。</p>
  <p>汕头中院一则判例中：楼上业主因无法排除自身装修与漏水关联且拒不配合鉴定，被判承担部分责任；开发商因未及时处理保修问题亦有过错，同样被判部分责任。可见开发商"不理不睬"本身即可能构成过错。</p>

  key:['物权变动以登记为生效要件','房产证照片属于个人信息','有权要求删除（个保法第47条）','住建投诉与证据固定'],
  html:`
  <p class="info-line">事由：二手商铺过户完成后，中介拍摄新房产证照片并自行留存，权利人咨询风险与应对<br>分析依据：《民法典》《不动产登记暂行条例》《房地产经纪管理办法》《个人信息保护法》</p>

  <h2>一、事实梳理</h2>
  <ol>
    <li>咨询人购买二手商铺，交易金额约 <strong>四五十万元</strong>；</li>
    <li>过户手续已完成，新不动产权证书已核发至咨询人名下；</li>
    <li>中介在证书出具后对新证拍照，并将照片<strong>自行留存带走</strong>；</li>
    <li>核心关切：照片被拿走是否影响产权安全、是否存在法律风险。</li>
  </ol>

  <h2>二、产权安全分析：照片不构成物权变动依据</h2>
  <h3>（一）不动产物权变动以登记为生效要件</h3>
  <p>根据《民法典》第二百零九条，不动产物权的设立、变更、转让和消灭，<strong>经依法登记，发生效力；未经登记，不发生效力</strong>。房产证仅是权利人享有物权的证明，而非物权本身；照片作为证书的影像复制件，不具有任何登记效力。</p>
  <h3>（二）办理抵押、过户须核验原件并本人到场</h3>
  <p>依据《不动产登记暂行条例》及登记实务，办理抵押登记、转移登记等业务，登记机构必须：</p>
  <ul>
    <li>核验不动产权证书<strong>原件</strong>与权利人身份证件原件；</li>
    <li>要求权利人<strong>本人到场签字</strong>，或持经依法公证的委托代理；</li>
    <li>部分业务还需人脸识别或视频核验。</li>
  </ul>
  <p>仅凭一张照片无法完成上述任何法定程序，故中介持有照片不会导致房屋被过户、抵押或处分，<strong>产权安全不受直接威胁</strong>。</p>
  <div class="concl-box">小结：产权层面无实质风险，不必因照片被留存而担心物权丧失。</div>

  <h2>三、个人信息权益分析：中介可能构成违规处理个人信息</h2>
  <h3>（一）房产证照片属于受法律保护的个人信息</h3>
  <p>照片载有权利人姓名、房屋坐落、证书编号等，单独或结合其他信息可识别特定自然人，属于《民法典》第一千零三十四条及《个人信息保护法》第四条所称<strong>个人信息</strong>。中介作为交易服务提供者，属于个人信息处理者。</p>
  <h3>（二）处理个人信息应遵循合法、正当、必要原则</h3>
  <p>根据《个人信息保护法》第五条、第六条，处理个人信息应具有明确合理目的、与目的直接相关、采取影响最小的方式、<strong>收集限于最小范围、不得过度收集</strong>。中介拍照若仅为核验过户结果或内部归档，应在必要范围内处理并于目的实现后及时删除或匿名化。若存在以下情形则可能侵害个人信息权益：</p>
  <ul>
    <li>未告知拍照用途、保存期限；</li>
    <li>超出本次交易必要范围留存；</li>
    <li>未经同意用于宣传、转发、倒卖或其他目的。</li>
  </ul>
  <p>咨询人依据《个人信息保护法》<strong>第四十七条</strong>，有权要求其删除相关个人信息。</p>
  <h3>（三）可能涉及的民事责任</h3>
  <p>若中介泄露、篡改、丢失照片，或未经同意向他人提供造成损害，依据《个人信息保护法》第六十九条，中介<strong>不能证明自己没有过错的，应承担损害赔偿等侵权责任</strong>（过错推定）。还可依《民法典》主张停止侵害、赔礼道歉等。</p>

  <h2>四、行业监管分析：受房地产经纪规范约束</h2>
  <p>根据《房地产经纪管理办法》第二十五条，经纪机构和人员不得<strong>泄露或不当使用委托人个人信息或商业秘密谋取不正当利益</strong>。照片若被用于推销、信息倒卖或造成泄露，即落入禁止情形。住建主管部门可对机构处以罚款、记入信用档案，情节严重的取消网上签约资格；对从业人员可处罚款并记入信用档案。</p>

  <h2>五、法律行动建议</h2>
  <h3>（一）固定证据</h3>
  <ul>
    <li>保留就"拍照留存"及"要求删除"沟通的微信记录、短信或通话录音；</li>
    <li>记录拍照时间、地点、在场人员及中介所属机构名称。</li>
  </ul>
  <h3>（二）书面要求删除</h3>
  <p>向中介及其所属机构明确提出：① 立即删除照片；② 确认删除（可要求截图或当面操作）；③ 声明未经同意不得留存、转发、复制或用于本次交易之外的任何用途；④ 告知违反将向住建部门投诉并追责。</p>
  <h3>（三）视情况投诉或进一步维权</h3>
  <ul>
    <li>中介拒绝删除或发现信息被滥用 → 向当地<strong>住建（房地产主管）部门</strong>投诉；</li>
    <li>造成实际损害（被诈骗、被骚扰、信息被倒卖）→ 向公安机关报案，或依《个人信息保护法》《民法典》提起民事诉讼。</li>
  </ul>
  <h3>（四）日常防范</h3>
  <p>对能准确报出房屋地址、姓名的陌生推销或"退税""贷款"电话保持警惕，不透露银行卡信息与验证码；定期线上查询不动产登记信息，确认无异常登记。</p>

  <h2>六、结论</h2>
  <table>
    <tr><th>事项</th><th>法律判断</th></tr>
    <tr><td>产权是否会被照片影响</td><td>不会。物权变动须登记、核验原件、本人到场，照片无法律效力</td></tr>
    <tr><td>中介留存照片是否合规</td><td>可能违规。超必要范围留存个人信息，涉嫌违反《个人信息保护法》及经纪管理办法</td></tr>
    <tr><td>是否有权要求删除</td><td>有权。依据《个人信息保护法》第四十七条</td></tr>
    <tr><td>主要风险性质</td><td>信息泄露风险，而非产权丧失风险</td></tr>
    <tr><td>建议行动</td><td>固定证据、书面要求删除、视情况向住建部门投诉</td></tr>
  </table>
  <div class="concl-box"><b>一句话总结：</b>产权无虞，信息权益有虞。法律上权利人有权要求删除，监管上中介行为有违规之嫌——保留证据、主动交涉即可有效控制风险。</div>
  <div class="disclaimer">本文档基于咨询人陈述事实及现行法律法规作出分析，仅供参考，不构成正式法律意见。如涉及具体纠纷，建议咨询执业律师。</div>`
},

  id:'case-report',
  title:'发现央企处长涉嫌靠行贿上位、长期受贿，如何规范举报并申请人身保护？',
  cat:'刑事举报 · 纪检监察',
  tag:'真实咨询案例 · 举报指引与法律保护',
  real:true,
  source:'举报人咨询 · 2026年11月整理',
  views:'1,542',
  summary:'举报人清楚往来人员但不知具体金额，担心打击报复、打击面过大与关系网干扰。本文给出可直接套用的举报信模板、行贿罪与受贿罪的法律定性、三大顾虑的逐一回应，以及实名举报的保护申请与投递渠道。',
  key:['举报信模板可直接套用','行贿罪与受贿罪定性','不知金额不影响受理','实名举报可申请保护'],
  html:`
  <p class="info-line">举报对象：某央企处长　｜　举报事项：涉嫌靠行贿受贿谋取处长职务，并利用职务便利在项目安排中收受贿赂，时间跨度十余年<br>举报人掌握情况：清楚具体往来人员但不掌握精确金额；担心打击报复、打击面过大及关系网干扰</p>

  <h2>一、举报信撰写模板（可直接套用）</h2>
  <p>不需要写全所有知情人，挑选最有把握的 <strong>3—5 条</strong>事实即可。金额写"不清楚"不影响受理。</p>
  <div class="quote-box">被举报人：XXX，XX央企XX处（部门）处长

举报事项：
一、被举报人涉嫌通过行贿手段谋取处长职务；
二、被举报人担任处长后，涉嫌利用职务便利，在项目审批、安排、发包过程中收受贿赂，时间跨度十余年。

具体线索：
1. 约XXXX年（或XXXX年至XXXX年间），在"XX项目"中，被举报人接受XXX（行贿人姓名/单位）的请托，为其谋取利益。我知悉此事的依据是：______（如：亲眼见到双方私下接触、该项目中标方明显不符合常规条件、事后听行贿人亲口提及等）。具体金额不详，但双方往来频繁。
2. （同上格式，写第二条最有把握的线索）
3. （同上，第三条）

补充说明：被举报人涉及的项目和人员较多，时间跨度长。本人仅就上述确认的部分提供线索，其余情况请组织依职权核查。本人清楚与哪些人员有往来，但具体金额不详。

举报人诉求：请求对上述问题依法初核。因担心遭受打击报复，申请对举报人身份信息严格保密，并依法提供保护。</div>

  <h2>二、具体情形与法律定性</h2>
  <h3>1. "靠行贿当上处长"——涉嫌行贿罪（《刑法》第389条）</h3>
  <p>为谋取不正当利益，给予国家工作人员以财物的，是行贿罪。如系通过向有决定权的人行贿而获得处长职位，该行为本身即涉嫌行贿，且属于"为谋取职务提拔、调整而行贿"，<strong>依法应从重处罚</strong>。</p>
  <h3>2. "利用职务之便做项目收受贿赂"——涉嫌受贿罪（《刑法》第385条）</h3>
  <p>国家工作人员利用职务上的便利，索取他人财物的，或者非法收受他人财物，为他人谋取利益的，是受贿罪。央企中从事公务的人员（如拥有项目审批、发包实权的处长），<strong>以国家工作人员论</strong>，所述情形符合受贿罪构成要件。</p>
  <h3>3. 时间跨度十余年不影响追诉</h3>
  <p>受贿罪的追诉时效根据法定最高刑确定。受贿数额巨大或有其他严重情节的，追诉时效可达十五年甚至二十年。时间跨度长恰恰说明行为具有持续性，纪委监委可通过调取历年项目档案、银行流水等方式核查。</p>

  <h2>三、三个顾虑的逐一回应</h2>
  <h3>顾虑一：不知道具体金额，有胜算吗？</h3>
  <p>有。纪检监察机关受理举报的门槛是<strong>有具体事实可查</strong>，不是"证据确凿"。《纪检监察机关处理检举控告工作规则》第十三条明确，仅列举违纪行为名称但无实质内容的不予受理。掌握"谁跟谁有往来、什么项目、时间跨度十几年"属于实质内容。金额查证是办案机关的职责，可通过调取项目档案、银行流水、谈话等方式固定证据——你提供的是核查方向，不是完整证据链。</p>
  <h3>顾虑二：怕打击面太大怎么办？</h3>
  <p>不需要举报所有行贿人。围绕被举报人本人的受贿事实，提供能确认的具体项目、时间、请托事项，以及一两个最确凿的行贿人线索作为佐证即可。行贿人是否被追究、追究到什么程度，由纪检监察机关依纪依法决定，不需要为"打击面"负责。</p>
  <h3>顾虑三：怕关系网互相照顾怎么办？</h3>
  <ul>
    <li><strong>向上级举报，避开本单位：</strong>央企处长的监察管辖通常归中央纪委国家监委或省级纪委监委，直接向上级反映；</li>
    <li><strong>回避制度：</strong>如发现受理机关人员与其有利害关系，有权申请回避；</li>
    <li><strong>保护申请：</strong>因举报感到人身安全或合法权利受威胁，可明确提出保护申请；</li>
    <li><strong>打击报复是加重情节：</strong>被举报人实施打击报复，属于从重或加重处分情节。</li>
  </ul>

  <h2>四、法律给你的保护</h2>
  <p><strong>1. 实名举报优先办理、有程序性反馈。</strong>实名举报优先办理、优先处置、给予答复；纪检监察机关在收到之日起 <strong>15 个工作日内</strong>告知是否受理，办结后 <strong>15 个工作日内</strong>反馈处理结果。</p>
  <p><strong>2. 有权申请保护。</strong>《纪检监察机关处理检举控告工作规则》第三十五条：因检举控告致合法权利受到威胁或侵害的，可以提出保护申请；第四十九条：提出保护申请后，纪检监察机关应当依法、及时提供保护，必要时可商请有关机关协助。</p>
  <p><strong>3. 被举报人"不得打击报复"是法定义务</strong>，实施打击报复属于从重处理情节。</p>
  <p><strong>4. 严格保密义务。</strong>纪检监察机关必须对举报人姓名、工作单位、住址等信息严格保密，严禁泄露给被举报人。</p>

  <h2>五、受理机关与投递渠道</h2>
  <table>
    <tr><th>渠道</th><th>信息</th></tr>
    <tr><td>湖北省纪委监委举报电话</td><td>027-12388</td></tr>
    <tr><td>湖北省纪委监委举报网址</td><td>hubei.12388.gov.cn</td></tr>
    <tr><td>中央纪委国家监委</td><td>12388 / www.12388.gov.cn</td></tr>
  </table>
  <p>建议优先向省级纪委监委实名举报，避开本单位内部可能的干扰；填写时在"是否申请保护"栏明确勾选或注明"申请保护"。</p>

  <h2>六、操作步骤（按顺序执行）</h2>
  <p><strong>第一步：整理材料。</strong>按第一部分模板写清 3—5 条最硬线索，聚焦被举报人本人的受贿事实，不需要写所有你知道的人。</p>
  <p><strong>第二步：提交举报。</strong>拨打 027-12388 或登录 hubei.12388.gov.cn，选择实名举报，注明"申请保护"。</p>
  <p><strong>第三步：提交后保持低调。</strong>不要在单位内部与任何人讨论此事。所掌握的往来信息本身具有敏感性，走漏风声可能导致对方串供或销毁痕迹。</p>
  <p><strong>第四步：等待反馈。</strong>15 个工作日内会收到受理告知；如超期未收到，可再次致电 12388 询问。</p>

  <div class="concl-box"><b>最后提醒：</b>你只需对自己提供的那部分事实的真实性负责，不需要承担"把所有行贿人都揪出来"的压力。把最硬的那一块交上去，剩下的交给组织。</div>
  <div class="disclaimer">本文档基于咨询人陈述整理，举报内容须真实，不得捏造、诬告陷害；具体处理以纪检监察机关依法认定为准。</div>`

  summary:'半包 6.5 万、定制家具 3.4 万，施工中不断冒出增项：门槛石、窗台石、美缝、灯带型材、贴砖背胶、橱柜碗篮。哪些有合同依据、哪些涉嫌侵害知情权？本文逐项定性并给出四步维权方案。',

  html:`
  <p class="info-line">房屋情况：97㎡住宅　｜　涉及合同：半包施工合同 65,000 元、定制家具合同 34,000 元<br>目的：梳理各项费用争议性质，界定装修公司义务边界与业主权利依据</p>

  <h2>一、半包合同项下争议费用</h2>
  <h3>（一）门槛石、窗台石</h3>
  <p>门槛石 150 元/条，窗台石 110 元/条（共 2 条）。石材类材料通常属<strong>主材</strong>，不在半包辅材范围内。行业惯例是"辅材由施工方提供，主材由业主采购"。装修公司代购可以，但费用本就不应包含在 65,000 元半包费中——此项收费有合同依据，但公司应在签约时明确告知主材清单范围，而非施工中途才告知。</p>
  <h3>（二）美缝（22 元/㎡，约 70 余㎡，总价约 1,500 余元）</h3>
  <p>是否属辅材，取决于合同附件《辅材清单》是否列明"美缝剂"或"美缝施工"。若未列明，另行收费不必然违法，但关键在于<strong>是否履行了如实告知义务</strong>。依据《消费者权益保护法》第八条，消费者享有知悉所购商品或服务真实情况的权利。报价时故意模糊美缝归属、施工中才提出收费，涉嫌侵犯知情权。22 元/㎡ 处于市场中低水平，但应确认材料品牌与型号，避免以次充好。</p>
  <h3>（三）灯带型材</h3>
  <p>灯带属灯具类主材，安装所需的铝槽、卡扣等型材在半包合同中通常不自动包含。除非合同明确写明"含灯带型材及安装"，另行收费有行业惯例支撑，但同样应事先告知而非事后追加。</p>
  <h3>（四）贴砖背胶（几百元）</h3>
  <p>这是半包增项最常见的争议点。传统半包辅材仅含水泥、沙子，背胶/瓷砖胶是大砖上墙工艺普及后新增材料。若《辅材清单》未列明背胶，收费有合同文本依据；但若签约时未提示可能产生费用，同样涉及知情权问题。</p>

  <h2>二、定制家具合同项下争议：橱柜碗篮</h2>
  <p>合同 34,000 元（含橱柜），对方主张不含碗篮。碗碟拉篮属<strong>功能五金</strong>，在定制家具行业通常单独计费，与柜体、门板、台面分列。若合同明细仅含柜体、门板、台面而未列碗碟拉篮，对方主张有行业惯例支撑。</p>
  <p>但需注意：若销售中曾口头承诺"该有的都有""全包"，或宣传材料有暗示性表述，可能构成误导。依据《民法典》第一百四十八条，一方以欺诈手段使对方在违背真实意思的情况下实施的民事法律行为，受欺诈方有权请求撤销。不过口头承诺举证难度较大，建议核查微信聊天记录或宣传单页。</p>

  <h2>三、核心问题："挤牙膏式加钱"是否违法</h2>
  <h3>（一）知情权侵害</h3>
  <p>《消费者权益保护法》第八条明确，消费者有权要求经营者提供服务价格、规格、费用等有关情况。签约时未完整披露可能产生的费用项目、施工中逐项追加，侵犯了对装修总成本的<strong>知情权</strong>。</p>
  <h3>（二）恶意增项的违约性质</h3>
  <p>依据《民法典》合同编，履行合同义务不符合约定的，应承担继续履行、采取补救措施或赔偿损失等违约责任。未事先告知并征得同意即无正当理由增加项目并要求加价，属<strong>单方面变更合同内容，构成违约</strong>。</p>
  <p>《住宅室内装饰装修管理办法》要求签订书面合同、明确双方权利义务。合同约定不明时，依《民法典》第五百一十条可协议补充；不能达成补充协议的，按合同相关条款或交易习惯确定。因此费用归属模糊不清时，你有权要求按交易习惯重新协商，而非被动接受单方定价。</p>

  <h2>五、行动建议</h2>
  <p><strong>第一步：固定证据。</strong>将半包合同《辅材清单》、定制家具合同明细页拍照留存；整理与装修公司沟通的微信记录，特别是费用承诺部分；要求公司把 22 元/㎡ 美缝的材料品牌、型号以<strong>文字形式</strong>发给你。</p>
  <p><strong>第二步：书面异议。</strong>对不合理的增项（尤其签约时完全未提及的项目），通过微信或书面形式提出异议，明确表示"该费用签约时未告知，要求提供合同依据或协商解决"。不要仅口头沟通，保留文字痕迹。</p>
  <p><strong>第三步：区分处理。</strong></p>
  <ul>
    <li>有合同依据的（石材主材、碗篮五金未列明）：可以接受，但要求出具材料品牌型号，确保质量对价；</li>

  <h2>一、贷款端：法人连带责任避不开</h2>
  <p>以公司名义贷经营贷，银行几乎都要求<strong>法定代表人签个人连带保证</strong>。公司还不上，银行可直接追你个人资产，包括其他城市房产。负债无全国统一上限，但多头授信、征信查询密集会触发风控，后续直接被拒。</p>
  <p>不需要注册集团公司。银行按监管规则，会把实际控制的所有公司认定为"<strong>集团客户</strong>"统一授信。要做的是：选定一家主力银行，集中代发工资、收款、纳税，主动申报关联关系，让银行做集团总授信和额度切分。别撒网式多头申贷，否则征信查花、整体额度做没。</p>

  <h2>二、股权端：不建议全设一人公司</h2>
  <p>当法定代表人不等于一人公司。一人公司指只有一个股东，2005 年就有；2024 年 7 月新《公司法》只是取消了"一个自然人只能设一家一人公司"的限制，现在可设多家。</p>
  <p>但不建议二十几家全设一人公司，原因在<strong>举证责任</strong>：</p>
  <ul>
    <li><strong>一人公司：</strong>法律推定财产混同，公司欠债时股东必须自证清白（审计报告、独立账册、清晰流水），证明不了就承担连带责任；</li>
    <li><strong>普通有限责任公司（两个以上股东，哪怕 1%）：</strong>不适用举证责任倒置，外部债权人想让股东个人担责，须自行举证证明滥用公司独立地位、财产混同，门槛高得多。</li>
  </ul>
  <p><strong>务实架构：</strong>每家你持股 99%，找一位成年且信得过的亲属持股 1%，做成普通有限责任公司。未成年子女不建议当股东（监护风险、登记摩擦、隔离效果打折扣）；父母或成年亲属可以。</p>
  <p>这里的"债权人"指公司之外的债权人（银行、供应商、员工等），不是另一位股东。</p>

  <h2>三、责任隔离：普通公司挡得住什么、挡不住什么</h2>
  <p>普通有限责任公司下，公司经营亏损通常不会直接动到你或孩子的个人财产——<strong>前提是</strong>：不签个人担保、不抽逃出资、不公私账户混用、每个公司独立记账。否则防火墙照样被突破。</p>
  <p>公司财产抵完债务仍有缺口，在普通公司且无个人担保前提下，债权人通常不能再追个人；公司走破产清算后注销，债务依法免除。</p>
  <p><strong>但挡不住两件事：</strong></p>
  <div class="risk-box">
    <ol style="margin-top:4px">
      <li><strong>认缴未实缴的出资：</strong>新《公司法》第五十四条，公司不能清偿到期债务时，债权人有权要求股东提前缴纳认缴出资（加速到期），在未出资范围内承担补充赔偿责任，上限即认缴数额。没钱缴义务也不消失——法院可终结本次执行，但将来有财产可恢复执行；可能被限高、纳入失信名单，子女就读高收费私立学校受限。小孩财产原则上不被直接执行，除非证明你转移财产逃债。</li>
      <li><strong>亲笔签下的个人担保：</strong>与股权结构无关，银行拿着担保合同就能追你。</li>
    </ol>
  </div>

  <h2>四、注册资本：写得务实、实缴到位</h2>
  <p>法律无最低限额，10 万—20 万实缴对起步科技公司通常够用，属"够用但偏紧"。写低对银行贷款和商业信任有一定影响，但银行更看重真实流水、纳税和抵押物；科技类政策资质看重"含科量"而非注册资本。</p>
  <p><strong>关键：</strong>注册资本写得务实并实缴到位，个人资产隔离才真正生效。写 20 万实缴 20 万，比写 100 万实缴 0 元安全得多。需要时再单独对某家公司增资，而不是一开始把二十几家全部写高。</p>

  <div class="sub-head">
    <div class="back" onclick="go('home')">‹</div>

      ${chips?`<div class="quick">${chips}</div>`:''}

function bindChatInput(){
  const box = document.getElementById('chatBox');
  if(box) box.scrollTop = box.scrollHeight;
  const w = document.querySelector('.chat-body'); if(w) window.scrollTo(0, document.body.scrollHeight);
}

function askQA(text){
  if(!text) return;
  state.page='chat';
  state.msgs.push({role:'me', text});
  state.msgs.push({role:'ai', typing:true});
  render(); scrollChatBottom();
  setTimeout(()=>{
    state.msgs.pop();
    const hit = matchQA(text);
    if(hit){
      const related = QA.filter(x=>x!==hit && x.cat===hit.cat).slice(0,2).map(x=>x.q);
      state.msgs.push({role:'ai', text:hit.a, law:hit.law, acts:hit.acts, related});
    } else {
      state.msgs.push({role:'ai',
        text:'你的问题已收到。为给出更准确的结论，我需要明确三点：① 你与对方是什么法律关系（劳动关系 / 买卖 / 租赁 / 婚姻 / 借贷等）；② 争议金额或核心诉求；③ 目前是否已有书面证据（合同、转账、聊天记录等）。\n\n你可以补充上述信息继续追问；若案情涉及多方责任、金额较大或已进入诉讼，建议使用「专题分析」生成完整意见书，或转人工律师。',
        law:'提示：法律咨询结论与具体事实、证据、当地裁判尺度密切相关，AI 意见仅供参考。',
        acts:'① 补充事实与证据继续追问；② 打开「专题案例库」查找同类纠纷的处理思路；③ 通过「法律工具」估算赔偿或诉讼费；④ 重大事项建议咨询执业律师。',
        related:['劳动纠纷怎么维权？','诉讼时效是多久？']
      });
    }
    render(); scrollChatBottom();
  }, 700);
}

function sendChat(){
  const el = document.getElementById('chatInput');
  const v = el ? el.value.trim() : '';
  if(!v) return;
  el.value='';
  askQA(v);
}
function scrollChatBottom(){
  setTimeout(()=>{ window.scrollTo(0, document.body.scrollHeight); }, 60);
}

function toggleEvidence(cb){

  state.draft.evidence = [...set];
}

/* 根据录入内容，匹配相关法条/问答，拼装结构化意见书 */
function buildTopicHtml(f){
  const hits = [];
  QA.forEach(q=>{ let s=0; q.keys.forEach(k=>{ if((f.title+' '+f.facts).indexOf(k)>=0) s+=(k.length>=3?2:1); }); if(s>0) hits.push({q,s}); });
  hits.sort((a,b)=>b.s-a.s);
  const top = hits.slice(0,2).map(x=>x.q);

  const amount = parseFloat(f.amount);
  const amtTxt = (!isNaN(amount)&&amount>0) ? `${amount.toLocaleString('zh-CN')} 元` : '未明确（请在后续补充）';
  const evList = (f.evidence&&f.evidence.length) ? f.evidence : ['暂无（建议尽快收集，详见行动建议）'];
  const lawBlocks = top.length ? top.map(q=>
    `<h3>${esc(q.q)}</h3><p>${esc(q.a)}</p>
     <div class="quote-box"><b>法律依据：</b>${esc(q.law)}</div>`).join('')
    : `<p>暂未匹配到高度对应的内置法条。建议在「法规速查」中按"${esc(f.cat)}"领域检索，或转人工律师进一步定性。</p>`;

  return `
  <p class="info-line">咨询人身份：${esc(f.role||'未填写')}　｜　对方：${esc(f.party||'未填写')}　｜　领域：${esc(f.cat)}<br>争议金额：${esc(amtTxt)}　｜　当前进展：${esc(f.stage||'刚发生，还没沟通')}　｜　生成时间：${esc(fmtDate(f.createdAt))}</p>

  <h2>一、事实梳理（根据你填写的内容）</h2>
  <div class="quote-box">${esc(f.facts||'（未填写事实经过）')}</div>
  <p>你的诉求概括为：<strong>${esc(f.title)}</strong>。以下分析以上述事实为基础，如事实有出入，结论需相应调整。</p>

  <h2>二、法律关系与可能适用的规则</h2>
  ${lawBlocks}
  <p style="font-size:12.5px;color:var(--ink3)">系统根据你填写的关键词匹配了 ${top.length} 条高相关法律知识，仅供初步定性参考。</p>

  <h2>三、争议焦点</h2>
  <ol>
    <li>双方之间成立何种法律关系（合同 / 侵权 / 劳动 / 婚姻家庭等），各自权利义务是什么；</li>
    <li>对方行为是否构成违约或侵权，责任比例如何划分；</li>
    <li>你主张的金额或诉求是否有合同、法律及证据支撑。</li>
  </ol>

  <h2>四、证据盘点</h2>
  <p>你当前已掌握的证据：</p>
  <ul>${evList.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>
  <p><strong>举证提示：</strong>证据应围绕"关系成立—对方违约/侵权事实—损失金额—因果关系"四条主线组织。聊天记录建议保留原始载体并做公证或可信存证；转账须有银行流水；书面文件保留原件。</p>

  <h2>五、行动建议（按步骤）</h2>
  <ol>
    <li><strong>固定证据（立即）：</strong>整理合同、付款凭证、沟通记录并备份；对易灭失的网页/聊天进行截图录屏，必要时做证据保全。</li>

    <ol style="margin-top:4px">

    </ol>
  </div>

  <div class="concl-box"><b>下一步：</b>按第五部分顺序推进，并可携带本意见书与证据清单，前往属地公共法律服务中心或委托执业律师做个案复核。</div>
  <div class="disclaimer">本意见书由智法通 AI 根据用户自行填写的信息自动生成，仅供参考，不构成正式法律意见或诉讼代理意见。AI 不能替代律师对证据原件的审查与出庭代理，重大、复杂或已进入诉讼的事项，请务必咨询执业律师。</div>`;
}

function submitTopic(){
  const cat = document.getElementById('tfCat').value;
  const title = document.getElementById('tfTitle').value.trim();
  const role = document.getElementById('tfRole').value.trim();
  const facts = document.getElementById('tfFacts').value.trim();
  const amount = document.getElementById('tfAmount').value;
  const party = document.getElementById('tfParty').value.trim();
  const stage = document.getElementById('tfStage').value;
  const agree = document.getElementById('tfAgree').checked;

  if(!title){ toast('请填写"一句话概括你的问题"'); return; }
  if(!role){ toast('请填写你与对方的关系/身份'); return; }
  if(!facts || facts.length<15){ toast('事实经过请至少填写 15 个字'); return; }
  if(!agree){ toast('请先勾选确认声明'); return; }

  const f = { cat, title, role, party, facts, amount, stage, evidence:state.draft.evidence||[], agree, createdAt:Date.now() };
  const rec = {

  };

  state.draft = {};

  state.page = 'case';

/* ============================================================
   专题访谈：聊天把案情聊清楚 → 情况说明 → 专题意见书 → 发布
   ============================================================ */
const IV_STEPS = [
  { key:'cat',    ask:'先确定一下问题领域，你的情况属于哪一类？（可点选，也可直接输入）',
    chips:TOPIC_CATS,
    hint:'领域有助于匹配对应的法律规则' },
  { key:'role',   ask:'请先介绍一下：你在这件事里是什么身份？和对方是什么关系？',
    placeholder:'如：我是公司员工 / 买方 / 租客 / 业主 / 出借人…',
    hint:'例：我是某公司的员工，对方是我的用人单位' },
  { key:'party',  ask:'对方是谁？（个人还是公司/机构？）',
    placeholder:'如：某科技有限公司 / 房东张某 / 某开发商',
    hint:'写清名称或称呼即可' },
  { key:'facts',  ask:'请按时间顺序讲讲事情经过：什么时候发生的？起因是什么？对方做了什么？你做了什么？',
    placeholder:'尽量写清时间、地点、人物、关键事件，可以分多条发送…',
    multiline:true,
    hint:'这是最重要的部分，可以连续发送多条，我会逐条记录' },
  { key:'amount', ask:'这件事涉及多少钱？（欠款、货款、工资、损失等；没有明确金额可点"暂无明确金额"）',
    chips:['暂无明确金额'],
    placeholder:'如：30000 元',
    isAmount:true },
  { key:'evidence', ask:'你现在手里有哪些证据？（可点选多个，也可文字补充）',
    chips:EVIDENCE_OPTS,
    multi:true,
    hint:'点选已有的证据，选完点"以上就是全部证据"' },
  { key:'stage',  ask:'事情目前进展到哪一步了？',
    chips:['刚发生，还没沟通','已自行协商，对方拖延或拒绝','已向平台/行政部门投诉','已发律师函或准备起诉','已进入仲裁/诉讼'] },
  { key:'claim',  ask:'你希望达到什么结果？（你的核心诉求）',
    placeholder:'如：要回工资和赔偿金 / 解除合同并退款 / 要求对方继续履行…',
    hint:'明确诉求，意见书会围绕它给出路径' }
];

function startInterview(){
  state.iv = { step:0, data:{evidence:[]}, logs:[], done:false };
  ivPush('ai', IV_STEPS[0].ask, {chips:IV_STEPS[0].chips, hint:IV_STEPS[0].hint});
  state.page = 'interview';
  render();
}

function ivPush(role, text, opt){
  state.iv.logs.push(Object.assign({role, text}, opt||{}));
}

/* 进度（0~100） */
function ivProgress(){
  if(!state.iv) return 0;
  return Math.round(((state.iv.step) / IV_STEPS.length) * 100);
}

/* 点击快捷芯片 */
function ivChip(val){
  if(state.iv && state.iv.revising){ ivRevise(val); return; }
  const st = IV_STEPS[state.iv.step];
  if(!st) return;
  if(st.multi){
    const set = new Set(state.iv.data.evidence||[]);
    if(val==='__done'){ ivNext(); return; }
    set.has(val)?set.delete(val):set.add(val);
    state.iv.data.evidence = [...set];
    // 更新最后一条 AI 消息的芯片选中态：重渲染
    ivPush('me', '（选择证据）'+val);
    render(); ivScroll();
    return;
  }
  ivAnswer(val);
}

/* 用户输入回答 */
function ivSend(){
  const el = document.getElementById('ivInput');
  const v = el ? el.value.trim() : '';
  if(!v) return;
  el.value='';
  ivAnswer(v);
}

function ivAnswer(raw){
  const st = IV_STEPS[state.iv.step];
  if(!st) return;
  let val = String(raw).trim();
  if(val==='__factsDone'){ ivNext(); return; }
  ivPush('me', val);

  if(st.key==='amount'){
    if(val.indexOf('暂无')>=0 || val.indexOf('没有')>=0){ state.iv.data.amount=''; }
    else {
      const num = (val.match(/[\d.]+/)||[])[0];
      state.iv.data.amount = num ? parseFloat(num) : '';
      if(!num){
        ivPush('ai','我没太识别出金额，可以直接输入数字，例如 30000；如果确实没有明确金额，请点「暂无明确金额」。',{chips:['暂无明确金额']});
        render(); ivScroll(); return;
      }
    }
  } else if(st.key==='evidence'){
    // 文字补充证据
    const set = new Set(state.iv.data.evidence||[]);
    if(!EVIDENCE_OPTS.includes(val)){ set.add(val); }
    state.iv.data.evidence = [...set];
    ivPush('ai',`已记录。目前证据：${(state.iv.data.evidence.join('、')||'暂无')}。还可以继续点选或补充，完成后点下方按钮。`,
      {chips:[...remainingEvChips(),'__done'], chipLabel:'__done|以上就是全部证据'});
    render(); ivScroll(); return;
  } else if(st.multiline){
    // facts 支持多条：以句号/换行判断是否足够，这里让用户主动点"我说完了"
    state.iv.data.facts = (state.iv.data.facts ? state.iv.data.facts+'\n' : '') + val;
    if(!state.iv._askedMore){
      state.iv._askedMore = true;
      ivPush('ai','好的，已记录这一段。如果还有补充的时间、细节或对方的回应，可以继续发；如果事情经过已经讲清楚，请点「我讲完了，下一步」。',
        {chips:['__factsDone'], chipLabel:'__factsDone|我讲完了，下一步'});
    } else {
      ivPush('ai','已补充记录。还可以继续，或点「我讲完了，下一步」。',
        {chips:['__factsDone'], chipLabel:'__factsDone|我讲完了，下一步'});
    }
    render(); ivScroll(); return;
  } else if(st.key==='cat'){
    state.iv.data.cat = val;
  } else {
    state.iv.data[st.key] = val;
  }
  ivNext();
}

function remainingEvChips(){
  const have = new Set(state.iv.data.evidence||[]);
  return EVIDENCE_OPTS.filter(x=>!have.has(x));
}

function ivNext(){
  state.iv.step += 1;
  if(state.iv.step >= IV_STEPS.length){
    finishInterview();
    return;
  }
  const st = IV_STEPS[state.iv.step];
  const opt = {};
  if(st.chips) opt.chips = st.chips;
  if(st.hint) opt.hint = st.hint;
  if(st.key==='evidence'){
    // 进入证据步：给出去重后的芯片 + 完成按钮
    opt.chips = [...remainingEvChips(),'__done'];
    opt.chipLabel = '__done|以上就是全部证据';
  }
  ivPush('ai', st.ask, opt);
  render(); ivScroll();
}

function ivScroll(){
  setTimeout(()=>{ const b=document.getElementById('ivBody'); if(b) b.scrollTop=b.scrollHeight; window.scrollTo(0,document.body.scrollHeight); },50);
}

/* 生成"详细情况说明"供用户确认 */
function buildStatement(d){
  const amt = (d.amount!==''&&d.amount!=null&&!isNaN(d.amount)) ? `${Number(d.amount).toLocaleString('zh-CN')} 元` : '暂无明确金额';
  const ev = (d.evidence&&d.evidence.length) ? d.evidence.join('、') : '暂未提供';
  return `【问题领域】${d.cat||'未选择'}
【咨询人身份】${d.role||'未填写'}
【对方当事人】${d.party||'未填写'}

【事情经过】
${d.facts||'（未填写）'}

【争议金额】${amt}
【现有证据】${ev}
【目前进展】${d.stage||'未选择'}
【核心诉求】${d.claim||'未填写'}`;
}

function finishInterview(){
  state.iv.done = true;
  const d = state.iv.data;
  d.cat = d.cat || '其他';
  const stmt = buildStatement(d);
  ivPush('ai','我已经根据我们的对话，把案情整理成下面这份《详细情况说明》，请核对：\n如果信息有误，点「需要修改」我会继续追问；确认无误后点「确认无误，生成专题意见书」。',
    {statement:stmt});
  render(); ivScroll();
}

function reviseStatement(){
  // 回到可补充状态：追加一轮自由修改
  state.iv.step = IV_STEPS.length; // 保持结束态但允许补充
  ivPush('ai','好的，请直接告诉我需要修改或补充的内容（例如"金额改成 5 万""再补充一条证据：对方的录音"），我会更新情况说明。',
    {chips:['补充/修改事实经过','修改争议金额','补充证据','修改诉求']});
  state.iv.revising = true;
  render(); ivScroll();
}

/* 在确认后的修改：简单关键词路由更新 */
function ivRevise(text){
  ivPush('me', text);
  const d = state.iv.data;
  let changed = false;
  const num = (text.match(/[\d.]+/)||[])[0];
  if((text.indexOf('金额')>=0||text.indexOf('改成')>=0||text.indexOf('万')>=0) && num){
    let v = parseFloat(num);
    if(text.indexOf('万')>=0 && v<100000) v = v*10000;
    d.amount = v; changed = true;
  }
  if(text.indexOf('证据')>=0){
    const extra = text.replace(/.*证据[:：]?/,'').replace(/[，,。；;]/g,' ').trim();
    if(extra){ const set=new Set(d.evidence||[]); extra.split(/\s+/).filter(Boolean).forEach(x=>set.add(x)); d.evidence=[...set]; changed=true; }
  }
  if(text.indexOf('诉求')>=0){
    d.claim = text.replace(/.*诉求[:：]?/,'').replace(/^[，,\s]+/,'') || d.claim; changed=true;
  }
  if(text.indexOf('事实')>=0||text.indexOf('经过')>=0||text.indexOf('补充')>=0){
    const add = text.replace(/^[，,\s]*(补充\/?修改?)?(事实经过)?[:：]?/,'');
    if(add && add.length>4){ d.facts = (d.facts?d.facts+'\n补充：':'') + add; changed=true; }
  }
  if(!changed){ d.facts = (d.facts?d.facts+'\n补充：':'') + text; changed=true; }
  ivPush('ai','已更新。最新的《详细情况说明》如下，请再次核对：',{statement:buildStatement(d)});
  render(); ivScroll();
}

/* 确认情况说明 → 生成专题意见书 → 写入我的专题 */
function confirmStatement(){
  const d = state.iv.data;
  const titleInput = (document.getElementById('ivTitle')||{}).value;
  const title = (titleInput||'').trim() || autoTitle(d);
  d.title = title;
  const rec = makeTopicRecord(d, {fromChat:true});
  MY_CASES.unshift(rec);
  saveMyCases();
  state.iv.recId = rec.id;
  ivPush('ai',`专题意见书已生成：《${title}》。\n它已保存到「案例 → 我的专题」。你可以先打开查看，也可以直接发布到案例库，公开供其他用户参考（发布前可再次确认，且会做匿名提示）。`,
    {openId:rec.id});
  render(); ivScroll();
}

function autoTitle(d){
  const base = (d.facts||'').replace(/\s+/g,'').slice(0,22);
  return base ? base : `${d.cat||'法律'}咨询专题`;
}

/* 由访谈数据构造意见书记录（复用 buildTopicHtml） */
function makeTopicRecord(d, opt){
  const f = { cat:d.cat, title:d.title, role:d.role, party:d.party, facts:d.facts,
              amount:d.amount, stage:d.stage, evidence:d.evidence||[], createdAt:Date.now() };
  return {
    id:'my-'+f.createdAt,
    title:d.title, cat:d.cat||'其他', tag:'我的专题', real:false, mine:true, published:false,
    source:'对话访谈生成', views:'0',
    statement: buildStatement(d),
    summary:(d.facts||'').length>80 ? d.facts.slice(0,80)+'…' : (d.facts||''),
    key:[d.cat, d.stage, ...((d.evidence||[]).slice(0,2))].filter(Boolean),
    createdAt:f.createdAt,
    html: buildTopicHtml(f)
  };
}

/* 发布到案例库（用户发布专题） */
function publishTopic(id){
  const rec = MY_CASES.find(x=>x.id===id);
  if(!rec) return;
  if(!confirm('发布后将作为「用户发布专题」在案例库公开展示。\n请确认：① 内容真实；② 已隐去真实姓名、电话、身份证号、详细住址、单位全称等个人信息。\n是否继续发布？')) return;
  if(PUB_CASES.some(x=>x.id===id)){ toast('该专题已发布'); return; }
  const pub = Object.assign({}, rec, {
    published:true, pubAt:Date.now(),
    tag:'用户发布专题', real:false, mine:true,
    source:'用户匿名发布 · ' + fmtDate(Date.now()).slice(0,10),
    views:'0'
  });
  PUB_CASES.unshift(pub);
  savePubCases();
  rec.published = true;
  saveMyCases();
  toast('已发布到案例库');
  state.caseId = id;
  state.page = 'case';
  render(); window.scrollTo(0,0);
}
function unpublishTopic(id){
  if(!confirm('确定撤回这条已发布的专题？撤回后案例库将不再公开展示。')) return;
  PUB_CASES = PUB_CASES.filter(x=>x.id!==id);
  savePubCases();
  const rec = MY_CASES.find(x=>x.id===id);
  if(rec){ rec.published=false; saveMyCases(); }
  toast('已撤回发布');
  render();
}

/* ---------- 专题访谈聊天窗口 ---------- */
function renderInterview(){
  const iv = state.iv;
  const cur = IV_STEPS[iv.step];
  const placeholder = cur ? (cur.placeholder || '输入你的回答…') : '输入补充内容…';
  const logs = iv.logs.map(m=>{
    if(m.role==='me') return `<div class="msg me">${esc(m.text)}</div>`;
    let extra='';
    if(m.hint) extra += `<div class="law" style="background:#f6f8fb;border-left-color:var(--ink3)"><b>💡 提示</b><br>${esc(m.hint)}</div>`;
    if(m.chips){
      let chips = m.chips.map(c=>{
        let label=c, val=c;
        if(m.chipLabel){
          const mm = m.chipLabel.split('|');
          if(mm[0]===c) label=mm[1];
        }
        if(c==='__done'||c==='__factsDone') return `<span class="cchip go" onclick="ivChip('${c}')">${esc(label)}</span>`;
        const sel = (c!=='__done'&&(iv.data.evidence||[]).includes(c)) ? ' sel':'';
        return `<span class="cchip${sel}" onclick="ivChip('${c}')">${esc(label)}</span>`;
      }).join('');
      extra += `<div class="chipset">${chips}</div>`;
    }
    if(m.statement){
      extra += `<div class="stmt-card">
        <div class="stmt-head">📋 详细情况说明（请核对）</div>
        <div class="stmt-body">${esc(m.statement)}</div>
        <input class="stmt-title" id="ivTitle" maxlength="50" placeholder="给专题起个标题（也可用默认标题）">
        <div class="stmt-acts">
          <span class="no" onclick="reviseStatement()">需要修改 / 补充</span>
          <span class="ok" onclick="confirmStatement()">确认无误，生成专题意见书</span>
        </div>
      </div>`;
    }
    if(m.openId){
      extra += `<div class="chipset">
        <span class="cchip go" onclick="openCase('${m.openId}')">📄 打开专题意见书</span>
        <span class="cchip" onclick="go('cases')">去「我的专题」查看</span>
      </div>`;
    }
    return `<div class="msg ai">${esc(m.text).replace(/\n/g,'<br>')}${extra}</div>`;
  }).join('');

  return `
  <div class="sub-head">
    <div class="back" onclick="go('cases')">‹</div>
    <div><h3>专题案情访谈</h3><small>对话式梳理 · AI 逐项追问</small></div>
  </div>
  <div class="iv-progress">
    <div class="iv-bar"><i style="width:${ivProgress()}%"></i></div>
    <div class="iv-meta"><span>${iv.done?'已完成访谈，待确认情况说明':'正在了解案情（'+(Math.min(iv.step+1,IV_STEPS.length))+'/'+IV_STEPS.length+'）'}</span><span>${ivProgress()}%</span></div>
  </div>
  <div class="chat-body">
    <div class="chat-box" id="ivBody">
      <div class="msg ai">你好，我是<strong>专题法律顾问</strong> 🤝<br>大问题需要把事实、证据和诉求聊透。接下来我会分 ${IV_STEPS.length} 步向你提问，你像和律师对话一样回答即可，中途也可以补充。聊完后我会先整理一份《详细情况说明》给你确认，再生成完整的专题意见书。</div>
      ${logs}
    </div>
  </div>
  <div class="chat-input">
    <input id="ivInput" placeholder="${placeholder}" onkeydown="if(event.key==='Enter')ivInputGo()">
    <button class="iv-send" onclick="ivInputGo()">发送</button>
  </div>
  ${tabbar()}`;
}

/* 输入框回车/按钮统一入口：区分访谈中与修改中 */

  if(state.iv && state.iv.revising){ ivRevise(document.getElementById('ivInput').value.trim()); document.getElementById('ivInput').value=''; return; }
  ivSend();
}

        ${isPub
          ? `<div class="published-btn" onclick="unpublishTopic('${c.id}')">✓ 已发布 · 撤回</div>`
          : `<div class="publish-btn" onclick="publishTopic('${c.id}')">发布为专题</div>`}
      </div>
      <div style="display:flex;gap:10px;margin-top:10px">
        <div class="calc-btn" style="flex:1;background:#fff;color:var(--red);border:1px solid #f0caca" onclick="delMyCase('${c.id}', true)">删除该专题</div>
      </div>`
      :`<div style="display:flex;gap:10px;margin-top:26px">
        <div class="calc-btn" style="flex:1;background:linear-gradient(135deg,#0f2847,#1e5088)" onclick="go('chat')">咨询类似问题</div>
        <div class="calc-btn" style="flex:1" onclick="toast('已提交律师复核申请（演示环境）')">申请律师复核</div>
      </div>`}
    </div>
  </div>
  ${tabbar()}`;
}

/* ---------- 法律工具 ---------- */
const TOOLS = [
  {id:'fee', icon:'🧾', cls:'t1', name:'诉讼费计算器', desc:'按《诉讼费用交纳办法》分段累计估算案件受理费'},
  {id:'ot', icon:'⏰', cls:'t2', name:'加班费计算器', desc:'工作日 1.5 倍 / 休息日 2 倍 / 法定节假日 3 倍'},
  {id:'loan', icon:'💰', cls:'t3', name:'借贷利息计算器', desc:'按年利率与天数计算，并提示 4 倍 LPR 上限'},
  {id:'sev', icon:'📦', cls:'t4', name:'经济补偿金计算器', desc:'N / N+1 / 2N，按工作年限与月工资估算'}
];
function renderTools(){
  return `
  <div class="sub-head">
    <div class="back" onclick="go('home')">‹</div>
    <div><h3>法律工具</h3><small>常用计算 · 快速估算</small></div>
  </div>
  <div class="tool-list">
    ${TOOLS.map(t=>`<div class="tool-item press" onclick="openTool('${t.id}')">
      <div class="ticon ${t.cls}">${t.icon}</div>
      <div><b>${t.name}</b><span>${t.desc}</span></div>
      <span class="arr">›</span>
    </div>`).join('')}
    <div class="mode-tip" style="margin-top:14px">计算结果为估算参考，实际金额以法院核定、合同约定或社保经办机构认定为准。</div>
  </div>
  <div class="sheet-mask" id="sheetMask" onclick="if(event.target===this)closeTool()">
    <div class="sheet" id="sheetBody"></div>
  </div>
  ${tabbar()}`;
}

function closeTool(){ document.getElementById('sheetMask').classList.remove('on'); }
function openTool(id){
  const mask = document.getElementById('sheetMask');
  const body = document.getElementById('sheetBody');
  if(id==='fee'){
    body.innerHTML = `<h3>诉讼费计算器 <span class="x" onclick="closeTool()">×</span></h3>
      <div class="field-row"><label>诉讼请求金额（元）</label><input id="feeAmt" type="number" placeholder="如 300000" inputmode="decimal"></div>
      <button class="calc-btn" onclick="calcFee()">计算受理费</button>
      <div class="calc-result" id="feeRes"></div>`;
  } else if(id==='ot'){
    body.innerHTML = `<h3>加班费计算器 <span class="x" onclick="closeTool()">×</span></h3>
      <div class="field-row"><label>月工资（元，按劳动合同约定）</label><input id="otWage" type="number" placeholder="如 8000" inputmode="decimal"></div>
      <div class="field-row"><label>工作日加班（小时）</label><input id="otA" type="number" placeholder="0" inputmode="decimal"></div>
      <div class="field-row"><label>休息日加班（小时）</label><input id="otB" type="number" placeholder="0" inputmode="decimal"></div>
      <div class="field-row"><label>法定节假日加班（小时）</label><input id="otC" type="number" placeholder="0" inputmode="decimal"></div>
      <button class="calc-btn" onclick="calcOt()">计算加班费</button>
      <div class="calc-result" id="otRes"></div>
      <div class="mode-tip" style="margin-top:12px">小时工资 = 月工资 ÷ 21.75 ÷ 8。依据《劳动法》第四十四条。</div>`;
  } else if(id==='loan'){
    body.innerHTML = `<h3>借贷利息计算器 <span class="x" onclick="closeTool()">×</span></h3>
      <div class="field-row"><label>本金（元）</label><input id="lnP" type="number" placeholder="如 100000" inputmode="decimal"></div>
      <div class="field-row"><label>约定年利率（%）</label><input id="lnR" type="number" placeholder="如 12" inputmode="decimal"></div>
      <div class="field-row"><label>借款天数</label><input id="lnD" type="number" placeholder="如 365" inputmode="decimal"></div>
      <button class="calc-btn" onclick="calcLoan()">计算利息</button>
      <div class="calc-result" id="lnRes"></div>
      <div class="mode-tip" style="margin-top:12px">司法保护上限为合同成立时一年期 LPR 的 4 倍（按 LPR 3.0% 计约 12%/年）。超过上限部分，法院不予支持。</div>`;
  } else if(id==='sev'){
    body.innerHTML = `<h3>经济补偿金计算器 <span class="x" onclick="closeTool()">×</span></h3>
      <div class="field-row"><label>月平均工资（元，解除前 12 个月）</label><input id="svWage" type="number" placeholder="如 10000" inputmode="decimal"></div>
      <div class="field-row"><label>工作年限（年，可填小数如 3.5）</label><input id="svYear" type="number" placeholder="如 3.5" inputmode="decimal"></div>
      <div class="field-row"><label>解除情形</label>
        <select id="svType">
          <option value="n">协商一致 / 经济性裁员（N）</option>
          <option value="n1">无过失性辞退未提前 30 天通知（N+1）</option>
          <option value="2n">违法解除（2N）</option>
        </select>
      </div>
      <button class="calc-btn" onclick="calcSev()">计算补偿金</button>
      <div class="calc-result" id="svRes"></div>
      <div class="mode-tip" style="margin-top:12px">月工资高于当地上年度职工月平均工资 3 倍的，按 3 倍封顶且年限最高 12 年。</div>`;
  }
  mask.classList.add('on');
}

function fmtMoney(n){ return '¥ ' + Math.round(n).toLocaleString('zh-CN'); }
function num(id){ const v = parseFloat((document.getElementById(id)||{}).value); return isNaN(v)?0:v; }

function calcFee(){
  const x = num('feeAmt');
  if(x<=0){ toast('请输入诉讼请求金额'); return; }
  let f = 0;
  if(x<=10000) f = 50;
  else {
    f = 50;
    const seg = [[10000,100000,.025],[100000,200000,.02],[200000,500000,.015],[500000,1000000,.01],[1000000,2000000,.009],[2000000,5000000,.008],[5000000,10000000,.007],[10000000,20000000,.006]];
    seg.forEach(([a,b,r])=>{ if(x>a) f += (Math.min(x,b)-a)*r; });
    if(x>20000000) f += (x-20000000)*.005;
  }
  const r = document.getElementById('feeRes');
  r.className='calc-result on';
  r.innerHTML = `<span style="font-size:13px;color:rgba(255,255,255,.75)">案件受理费（一审，估算）</span>
    <div class="big">${fmtMoney(f)}</div>
    <div class="det">适用简易程序减半交纳：约 ${fmtMoney(f/2)}<br>调解结案或撤诉的减半交纳<br>不含保全费、公告费、鉴定费等</div>
    <small>依据《诉讼费用交纳办法》第十三条，分段累计计算。</small>`;
}

function calcOt(){
  const w = num('otWage');
  if(w<=0){ toast('请输入月工资'); return; }
  const h = w/21.75/8;
  const a = num('otA'), b = num('otB'), c = num('otC');
  const ta = h*1.5*a, tb = h*2*b, tc = h*3*c;
  const total = ta+tb+tc;
  const r = document.getElementById('otRes');
  r.className='calc-result on';
  r.innerHTML = `<span style="font-size:13px;color:rgba(255,255,255,.75)">应发加班费合计</span>
    <div class="big">${fmtMoney(total)}</div>
    <div class="det">小时工资：${fmtMoney(h)}<br>工作日 ${a} 小时 × 1.5 = ${fmtMoney(ta)}<br>休息日 ${b} 小时 × 2 = ${fmtMoney(tb)}<br>法定节假日 ${c} 小时 × 3 = ${fmtMoney(tc)}</div>
    <small>依据《劳动法》第四十四条；月计薪天数按 21.75 天计算。</small>`;
}

function calcLoan(){
  const p = num('lnP'), rate = num('lnR'), d = num('lnD');
  if(p<=0||d<=0){ toast('请输入本金与借款天数'); return; }
  const interest = p*rate/100*d/365;
  const cap = p*12/100*d/365;
  const over = rate>12;
  const r = document.getElementById('lnRes');
  r.className='calc-result on';
  r.innerHTML = `<span style="font-size:13px;color:rgba(255,255,255,.75)">按约定利率计算利息</span>
    <div class="big">${fmtMoney(interest)}</div>
    <div class="det">本息合计：${fmtMoney(p+interest)}<br>司法保护上限（按 12%/年）：${fmtMoney(cap)}<br>${over?'<span style="color:#ffb4b4">约定利率已超过 4 倍 LPR，超出部分可能不被支持</span>':'约定利率未超 4 倍 LPR 参考上限'}</div>
    <small>实际以合同成立时一年期 LPR 的四倍为准，LPR 会随市场调整。</small>`;
}

function calcSev(){
  const w = num('svWage'), y = num('svYear');
  if(w<=0||y<=0){ toast('请输入月工资与工作年限'); return; }
  const full = Math.floor(y), rem = y-full;
  let n = full + (rem>=0.5?1:(rem>0?0.5:0));
  if(n<=0) n = 0.5;
  const type = document.getElementById('svType').value;
  let months = n, label = 'N';
  let base = n*w;
  if(type==='n1'){ base = n*w + w; label='N+1'; }
  if(type==='2n'){ base = 2*n*w; label='2N'; }
  const r = document.getElementById('svRes');
  r.className='calc-result on';
  r.innerHTML = `<span style="font-size:13px;color:rgba(255,255,255,.75)">经济补偿 / 赔偿金（估算）</span>
    <div class="big">${fmtMoney(base)}</div>
    <div class="det">计算年限：${n} 个月工资（${label}）<br>月工资基数：${fmtMoney(w)}<br>${type==='n1'?'含代通知金 1 个月工资':''}${type==='2n'?'违法解除按经济补偿标准二倍':''}</div>
    <small>依据《劳动合同法》第四十七条、第八十七条；高收入者适用 3 倍封顶与 12 年上限。</small>`;
}

/* ---------- 法规速查 ---------- */
function setLawCat(c){ state.lawCat = c; render(); }
function filterLaw(v){ state.lawKw = v; render(); }
function renderLaws(){
  const cats = ['全部',...new Set(LAWS.map(x=>x.cat))];
  const kw = state.lawKw.trim();
  const list = LAWS.filter(x=>(state.lawCat==='全部'||x.cat===state.lawCat) && (!kw || (x.name+x.txt).indexOf(kw)>=0));
  return `
  <div class="sub-head">
    <div class="back" onclick="go('home')">‹</div>
    <div><h3>法规速查</h3><small>常用法条 · 关键词检索</small></div>
  </div>
  <div class="law-search"><input placeholder="搜索法规或条文，如 定金 / 加班 / 彩礼" value="${esc(state.lawKw)}" oninput="filterLaw(this.value)"></div>
  <div class="law-cat">${cats.map(c=>`<span class="${state.lawCat===c?'on':''}" onclick="setLawCat('${c}')">${c}</span>`).join('')}</div>
  ${list.length?list.map(x=>`<div class="law-item">
      <b>${esc(x.name)}</b><span class="law-no">${esc(x.no)}</span>
      <p>${esc(x.txt)}</p>
    </div>`).join(''):'<div class="law-empty">没有找到相关条文，换个关键词试试</div>'}
  <div style="height:24px"></div>
  ${tabbar()}`;
}

/* ---------- 渲染入口 ---------- */
function render(){
  let html = '';
  if(state.page==='home') html = renderHome();
  else if(state.page==='chat') html = renderChat();
  else if(state.page==='cases') html = renderCases();
  else if(state.page==='topic-form') html = renderTopicForm();
  else if(state.page==='interview') html = renderInterview();
  else if(state.page==='case') html = renderCaseDetail();
  else if(state.page==='tools') html = renderTools();
  else if(state.page==='law') html = renderLaws();
  app.innerHTML = html;
  if(state.page==='chat') bindChatInput();
  if(state.page==='interview') ivScroll();
}

window.setLawCat = setLawCat; window.filterLaw = filterLaw; window.toast = toast;
window.startInterview = startInterview; window.ivChip = ivChip; window.ivInputGo = ivInputGo;
window.ivSend = ivSend; window.reviseStatement = reviseStatement; window.confirmStatement = confirmStatement;

render();
</script>
