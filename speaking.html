<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>像素英语口语练习 v2 · 真正能练口语</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --px-line:#c9b9a8;
  --ink:#4a3728;
  --ink2:#8a7460;
  --pink:#f4679d;
  --green:#2ecc71;
  --yellow:#f5c542;
  --red:#e85d5d;
}
html,body{height:100%;}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#1c2733;color:var(--ink);display:flex;justify-content:center;}
.phone{
  width:100%;max-width:430px;min-height:100vh;position:relative;
  background:linear-gradient(180deg,#9fd9ff 0%,#c9edff 30%,#e8f9ff 55%,#fdf3e3 100%);
  overflow-x:hidden;padding-bottom:120px;
}
.cloud{position:absolute;opacity:.85;pointer-events:none;}
.cloud.c1{top:96px;right:-14px;}
.cloud.c2{top:230px;left:-20px;transform:scale(.7);}
.px-card{background:#fffdf6;border:2px solid var(--px-line);border-radius:8px;box-shadow:0 3px 0 rgba(90,60,30,.18);}
.press{transition:transform .08s;cursor:pointer;user-select:none;}
.press:active{transform:scale(.95);}

/* 通用头部（二级页） */
.page-head{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:rgba(255,255,255,.55);backdrop-filter:blur(2px);
  border-bottom:2px solid var(--px-line);position:sticky;top:0;z-index:20;
}
.page-head .back{
  width:32px;height:32px;border:2px solid var(--px-line);border-radius:6px;
  background:#fffdf6;display:grid;place-items:center;font-size:16px;cursor:pointer;
}
.page-head h2{flex:1;font-size:16px;color:#3d2b1f;letter-spacing:1px;}
.page-head .right{font-size:12px;color:var(--ink2);cursor:pointer;}

/* 模块1 状态/品牌 */
.statusbar{
  height:34px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;font-size:12px;font-weight:700;color:#33475b;
  background:rgba(255,255,255,.55);backdrop-filter:blur(2px);
}
.statusbar .sicons{letter-spacing:2px;font-size:11px;}
.brand{position:relative;padding:14px 16px 6px;}
.brand h1{
  text-align:center;font-size:24px;letter-spacing:3px;color:#3d2b1f;font-weight:900;
  text-shadow:2px 2px 0 #ffe9c9,4px 4px 0 rgba(90,60,30,.12);
}
.brand-row{display:flex;align-items:flex-end;gap:8px;margin-top:10px;}
.pixel-girl{width:96px;height:108px;flex:none;position:relative;}
.pixel-girl i{position:absolute;width:6px;height:6px;}
.bubble{
  position:relative;background:#fff;border:2px solid var(--px-line);
  border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;color:#6b4b2a;
  box-shadow:0 3px 0 rgba(90,60,30,.18);margin-bottom:10px;
}
.bubble::before{content:"";position:absolute;left:-8px;bottom:12px;border:6px solid transparent;border-right-color:#fff;}
.deco{margin-left:auto;display:flex;gap:6px;align-items:flex-end;font-size:20px;filter:saturate(1.1);}

/* 看板 */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 16px 0;}
.stat{padding:10px 6px;text-align:center;}
.stat .ic{font-size:18px;}
.stat b{display:block;font-size:16px;margin-top:2px;color:#3d2b1f;}
.stat span{font-size:10px;color:var(--ink2);}
.stat .bar{margin-top:6px;height:4px;border:1px solid var(--px-line);border-radius:2px;background:#fff;overflow:hidden;}
.stat .bar > div{height:100%;background:var(--pink);transition:width .4s;}

/* 主功能 */
.funcs{margin:14px 16px 0;display:flex;flex-direction:column;gap:14px;}
.func{
  min-height:92px;border-radius:8px;border:2px solid var(--px-line);
  box-shadow:0 3px 0 rgba(90,60,30,.18);display:flex;align-items:center;gap:12px;padding:0 16px;
  position:relative;overflow:hidden;cursor:pointer;
}
.func .f-ic{font-size:34px;filter:drop-shadow(2px 2px 0 rgba(90,60,30,.25));}
.func .f-txt{flex:1;}
.func .f-txt b{font-size:18px;letter-spacing:1px;display:block;}
.func .f-txt span{font-size:12px;opacity:.85;}
.func .arrow{font-size:20px;color:#fff;}
.f1{background:linear-gradient(135deg,#FFB6C1,#FF9AA2);}.f1 b{color:#2b1a1a;}.f1 span{color:#7c3a44;}
.f2{background:linear-gradient(135deg,#FFE29A,#FFCC66);}.f2 b{color:#4a3315;}.f2 span{color:#8a6a2f;}
.f3{background:linear-gradient(135deg,#B5EAD7,#8DD8B0);}.f3 b{color:#1f4a33;}.f3 span{color:#3e6e52;}
.go-btn{background:#ff8a5c;color:#fff;font-size:12px;font-weight:900;border:2px solid #d96a3f;border-radius:6px;padding:6px 10px;box-shadow:0 2px 0 #d96a3f;}

/* 分区 */
.sect{margin:18px 16px 0;}
.sect-head{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.sect-head b{font-size:16px;color:#3d2b1f;}
.sect-head .more{margin-left:auto;font-size:12px;color:#8a7460;display:flex;align-items:center;gap:4px;cursor:pointer;}
.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.topic{padding:6px;position:relative;cursor:pointer;}
.topic .pic{height:74px;border-radius:4px;border:2px solid var(--px-line);display:grid;place-items:center;font-size:30px;}
.topic .pic.p1{background:linear-gradient(180deg,#ffe3c2,#ffd0a3);}
.topic .pic.p2{background:linear-gradient(180deg,#d8e8ff,#b9d4ff);}
.topic .pic.p3{background:linear-gradient(180deg,#d6f5d0,#b3e6ab);}
.topic .pic.p4{background:linear-gradient(180deg,#f5d6ff,#e8b9ff);}
.topic .pic.p5{background:linear-gradient(180deg,#ffd6d6,#ffb3b3);}
.topic .pic.p6{background:linear-gradient(180deg,#d6fff5,#abffe0);}
.topic .name{text-align:center;font-size:12px;font-weight:700;margin-top:6px;}
.topic .stars{text-align:center;font-size:10px;color:#f5a623;letter-spacing:1px;}
.heart{position:absolute;top:8px;left:8px;font-size:14px;cursor:pointer;user-select:none;}

/* 历史记录 */
.rec{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;}
.rec + .rec{margin-top:8px;}
.rec .r-ic{width:38px;height:38px;flex:none;border-radius:6px;border:2px solid var(--px-line);display:grid;place-items:center;font-size:18px;background:#fdeed7;}
.rec .r-mid{flex:1;}
.rec .r-mid b{font-size:14px;color:#3d2b1f;display:block;}
.rec .r-mid span{font-size:11px;color:var(--ink2);}
.rec .xp{background:#f4679d;color:#fff;font-size:11px;font-weight:900;border-radius:4px;padding:3px 8px;border:1.5px solid #d94f83;}

/* Tab */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;height:72px;background:#fffdf6;
  border-top:2px solid var(--px-line);display:flex;z-index:50;
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#7c6a55;cursor:pointer;transition:color .1s;}
.tab .t-ic{font-size:20px;}
.tab.on{color:var(--pink);font-weight:900;}
.tab.on .t-ic{filter:drop-shadow(1px 1px 0 rgba(244,103,157,.35));}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:130px;transform:translateX(-50%) translateY(20px);
  background:rgba(40,30,20,.92);color:#ffe9c9;font-size:13px;padding:10px 18px;
  border-radius:6px;border:2px solid #6b533b;opacity:0;pointer-events:none;
  transition:.25s;z-index:99;max-width:80vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============ 语音挑战 / 跟读打分 ============ */
.stage{padding:12px 16px;}
.card-en{
  background:#fffdf6;border:2px solid var(--px-line);border-radius:10px;
  padding:16px;box-shadow:0 3px 0 rgba(90,60,30,.18);margin-bottom:12px;
}
.card-en .zh{color:var(--ink2);font-size:12px;margin-bottom:6px;}
.card-en .en{font-size:18px;font-weight:700;line-height:1.7;letter-spacing:.3px;}
/* 逐词高亮 */
.word{display:inline-block;min-width:.3em;padding:0 1px;margin:0 1px;border-radius:2px;}
.word.hit{background:#bff7cf;color:#145a32;}
.word.miss{background:#ffd4d4;color:#8b1a1a;text-decoration:line-through;}
.word.partial{background:#fff0b3;color:#7a5c00;}
.action-row{display:flex;gap:8px;margin-top:10px;}
.btn{
  flex:1;background:#fffdf6;border:2px solid var(--px-line);border-radius:8px;
  padding:10px;font-size:13px;font-weight:700;color:#3d2b1f;cursor:pointer;
  box-shadow:0 2px 0 rgba(90,60,30,.18);
}
.btn:active{transform:scale(.95);}
.btn.primary{background:linear-gradient(135deg,#FFB6C1,#FF9AA2);border-color:#d94f83;color:#2b1a1a;}
.btn.play{background:linear-gradient(135deg,#B5EAD7,#8DD8B0);border-color:#4f9a70;color:#1f4a33;}
.btn:disabled{opacity:.55;cursor:not-allowed;}

/* 实时识别条 */
.transcript{
  min-height:40px;border:2px dashed var(--px-line);border-radius:8px;
  padding:10px;background:rgba(255,255,255,.6);margin:8px 0;font-size:14px;color:#3d2b1f;
}
.transcript.interim{color:#8a7460;font-style:italic;}

/* 麦克风动效 */
.mic-wrap{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;}
.mic-btn{
  width:60px;height:60px;border-radius:50%;border:3px solid #fff;
  background:linear-gradient(135deg,#f4679d,#d94f83);color:#fff;font-size:24px;font-weight:900;
  cursor:pointer;box-shadow:0 4px 0 #a33463;position:relative;
}
.mic-btn.rec{animation:pulse .9s ease-in-out infinite;background:linear-gradient(135deg,#e85d5d,#b42020);box-shadow:0 4px 0 #6d1313;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.mic-btn.off{background:#bbb;box-shadow:0 4px 0 #666;}

.score-bar{
  height:10px;border:1px solid var(--px-line);border-radius:5px;background:#fff;overflow:hidden;margin-top:6px;
}
.score-bar > div{height:100%;transition:width .4s ease-out;}
.score-text{font-size:28px;font-weight:900;text-align:center;margin-top:4px;}
.score-text.high{color:#2ecc71;}
.score-text.mid{color:#f5c542;}
.score-text.low{color:#e85d5d;}

/* 对话消息 */
.chat-scroll{height:calc(100vh - 260px);overflow-y:auto;padding:10px 14px 8px;}
.chat-msg{margin-bottom:10px;display:flex;gap:8px;align-items:flex-start;}
.chat-msg.me{flex-direction:row-reverse;}
.chat-msg .av{width:32px;height:32px;border-radius:6px;flex:none;border:2px solid var(--px-line);display:grid;place-items:center;font-size:16px;}
.chat-msg.you .av{background:#fdeed7;}
.chat-msg.me .av{background:#d8e8ff;}
.chat-msg .bubble{
  max-width:75%;padding:8px 12px;font-size:14px;border:2px solid var(--px-line);border-radius:10px;
  box-shadow:0 2px 0 rgba(90,60,30,.14);font-weight:500;margin:0;min-height:22px;
}
.chat-msg.you .bubble{background:#fffdf6;color:#3d2b1f;}
.chat-msg.me .bubble{background:linear-gradient(135deg,#FFB6C1,#FF9AA2);color:#2b1a1a;}
.chat-msg .zh-hint{font-size:11px;color:var(--ink2);margin-top:2px;}
.chat-input-area{
  position:sticky;bottom:0;background:rgba(255,255,255,.9);backdrop-filter:blur(4px);
  border-top:2px solid var(--px-line);padding:10px 14px;display:flex;gap:8px;align-items:center;
}
.chat-input-area input{
  flex:1;border:2px solid var(--px-line);border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;outline:none;
}
.chat-input-area input:focus{border-color:var(--pink);}

/* 复习卡片轮播 */
.review-wrap{padding:16px;min-height:calc(100vh - 260px);display:flex;flex-direction:column;}
.review-card{flex:1;}
.review-card .zh{text-align:center;font-size:13px;color:var(--ink2);margin-top:6px;}
.review-card .en{text-align:center;font-size:22px;font-weight:900;margin:14px 0;letter-spacing:.5px;}
.review-progress{font-size:12px;color:var(--ink2);text-align:center;margin-bottom:10px;}

/* 练习列表 */
.prac-list{padding:10px 16px;display:flex;flex-direction:column;gap:10px;}
.prac-item{background:#fffdf6;border:2px solid var(--px-line);border-radius:8px;padding:12px;box-shadow:0 2px 0 rgba(90,60,30,.18);}
.prac-item .zh{color:var(--ink2);font-size:12px;margin-bottom:4px;}
.prac-item .en{font-size:16px;font-weight:700;margin-bottom:6px;}
.prac-item .act{display:flex;gap:6px;}
.prac-item .act .btn{flex:none;padding:6px 10px;font-size:12px;}
.prac-item .score-tag{font-size:11px;color:var(--ink2);}

/* 收藏/历史空态 */
.empty-center{padding:60px 20px;text-align:center;color:var(--ink2);font-size:13px;}

/* 生成模板 */
.gen-wrap{padding:16px;}
.gen-tabs{display:flex;gap:6px;margin-bottom:10px;}
.gen-tabs .btn{flex:none;padding:8px 12px;font-size:12px;}
.gen-tabs .btn.on{background:linear-gradient(135deg,#FFE29A,#FFCC66);border-color:#b3862a;}

/* 小屏适配 */
@media (max-width:375px){
  .brand h1{font-size:21px;}
  .func{min-height:82px;}
  .card-en .en{font-size:16px;}
}
</style>
</head>
<body>
<div class="phone" id="app">

  <div class="cloud c1">☁️</div>
  <div class="cloud c2">☁️</div>

  <!-- 首页 -->
  <div data-page="home">
    <div class="statusbar">
      <span id="clock">22:06</span>
      <span class="sicons">📶 📡 🔋</span>
      <span class="capsule" style="border:1.5px solid rgba(51,71,91,.4);border-radius:14px;padding:1px 10px;font-size:11px;background:rgba(255,255,255,.7);color:#33475b;">◉ &nbsp;|&nbsp; ◧</span>
    </div>
    <header class="brand">
      <h1>英语口语练习</h1>
      <div class="brand-row">
        <div class="pixel-girl" id="pixelGirl"></div>
        <div class="bubble">Hi，Vicky 喊你练口语啦！</div>
        <div class="deco">🪟🌱📚</div>
      </div>
    </header>

    <section class="board">
      <div class="px-card stat press" data-toast="打卡日历"><div class="ic">🔥</div><b id="sStreak">12 天</b><span>连续打卡</span><div class="bar"><div style="width:100%"></div></div></div>
      <div class="px-card stat press" data-toast="等级与 XP"><div class="ic">⭐</div><b id="sLevel">Lv.7</b><span id="sXpRemain">还差 240 XP</span><div class="bar"><div id="sXpBar" style="width:0%"></div></div></div>
      <div class="px-card stat press" data-toast="今日训练时长"><div class="ic">🎯</div><b id="sGoal">0/15 分</b><span>今日目标</span><div class="bar"><div id="sGoalBar" style="width:0%"></div></div></div>
    </section>

    <section class="funcs">
      <div class="func f1 press" data-hash="chat">
        <span class="f-ic">🎤</span>
        <div class="f-txt"><b>自由对话</b><span>像美国朋友一样自然聊天</span></div>
        <span class="arrow">▸</span>
      </div>
      <div class="func f2 press" data-hash="practice">
        <span class="f-ic">💻📚</span>
        <div class="f-txt"><b>跟读练习</b><span>9 个主题 · 逐词打分</span></div>
        <span class="arrow">▸</span>
      </div>
      <div class="func f3 press" data-hash="review">
        <span class="f-ic">📖⏰</span>
        <div class="f-txt"><b>今日复习</b><span id="reviewCount">加载中…</span></div>
        <button class="go-btn press" data-hash="review">立即开始</button>
      </div>
    </section>

    <section class="sect">
      <div class="sect-head">
        ⭐<b>今日推荐主题</b>
        <span class="more press" id="shuffleBtn">换一换 🔄</span>
      </div>
      <div class="topics" id="topics"></div>
    </section>

    <section class="sect">
      <div class="sect-head">
        🏋️<b>最近训练记录</b>
        <span class="more press" data-hash="hist">查看更多 ▸</span>
      </div>
      <div id="historyWrap"></div>
    </section>

    <div style="text-align:center;margin:20px 0 6px;font-size:11px;color:#8a7460;">
      数据存于本机 · 清除浏览器数据会重置 ·
      <a href="#reset" style="color:#e85d5d;text-decoration:none;">重置进度</a>
    </div>
  </div>

  <!-- 自由对话 -->
  <div data-page="chat" style="display:none;">
    <div class="page-head">
      <div class="back press" data-hash="home">◀</div>
      <h2 id="chatTitle">自由对话</h2>
      <span class="right" id="chatTopicBtn" data-hash="practice">换主题 ▸</span>
    </div>
    <div class="chat-scroll" id="chatScroll"></div>
    <div class="chat-input-area">
      <input id="chatInput" placeholder="输入你的回答…回车发送">
      <button class="btn play press" id="chatMicBtn" style="flex:none;">🎤 语音</button>
    </div>
  </div>

  <!-- 跟读练习 -->
  <div data-page="practice" style="display:none;">
    <div class="page-head">
      <div class="back press" data-hash="home">◀</div>
      <h2>跟读练习</h2>
      <span class="right" id="pracTopicLabel"></span>
    </div>
    <div style="display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;">
      <button class="btn press" id="pracTopicSelect">选择主题 ▾</button>
      <button class="btn press" data-prac-mode="chain">连续挑战 🏆</button>
    </div>
    <div class="prac-list" id="pracList"></div>
  </div>

  <!-- 复习 -->
  <div data-page="review" style="display:none;">
    <div class="page-head">
      <div class="back press" data-hash="home">◀</div>
      <h2>今日复习</h2>
      <span class="right" id="reviewRight"></span>
    </div>
    <div class="review-wrap" id="reviewWrap"></div>
  </div>

  <!-- 收藏 -->
  <div data-page="fav" style="display:none;">
    <div class="page-head">
      <div class="back press" data-hash="home">◀</div>
      <h2>收藏复习</h2>
    </div>
    <div id="favWrap"></div>
  </div>

  <!-- 历史 -->
  <div data-page="hist" style="display:none;">
    <div class="page-head">
      <div class="back press" data-hash="home">◀</div>
      <h2>训练历史</h2>
      <span class="right" id="histStats"></span>
    </div>
    <div id="histWrap"></div>
  </div>

  <!-- 生成模板（附：场景/故事/演讲/对话） -->
  <div data-page="gen" style="display:none;">
    <div class="page-head">
      <div class="back press" data-hash="home">◀</div>
      <h2>生成训练材料</h2>
    </div>
    <div class="gen-wrap" id="genWrap"></div>
  </div>

  <!-- 底部 Tab（所有页都固定） -->
  <nav class="tabbar" id="tabbar">
    <div class="tab on" data-tab="home"><span class="t-ic">🏠</span>首页</div>
    <div class="tab" data-tab="practice"><span class="t-ic">⚔️</span>练习</div>
    <div class="tab" data-tab="fav"><span class="t-ic">📦</span>收藏复习</div>
    <div class="tab" data-tab="hist"><span class="t-ic">📜</span>历史</div>
  </nav>

  <div id="toast"></div>
</div>

<script>
/* ==========================================================
 * speaking-pixel v2 · 单文件自包含
 * A 真实语音练习（Web Speech API） + B 本地数据闭环（localStorage）
 * ========================================================== */

/* ---------- 0. 像素女孩 ---------- */
(function(){
  const P = {'.':'','h':'#8a5a3b','H':'#6b4423','f':'#ffd9b8','r':'#ff9e9e',
    'y':'#ffd23e','b':'#4a90d9','R':'#e84d6b','e':'#3d2b1f','w':'#fff'};
  const art = [
    '....RR....RR.....','...RRR....RRR....','....hhhhhhhh.....','...hhhhhhhhhh....',
    '..hhhhhhhhhhhh...','..hhHffffffHhh...','..hHffffffffHh...','....fefffef.f....',
    '....fffffff.r....','....fRffffRf.....','.....ffffff......','....yyfffyy......',
    '...bbbfffbbb.....','...bbbbbbbbbb....','...bybbbbbbby....','...bybbbbbbby....',
    '...bbbb..bbbb....','...HHH....HHH....'];
  const g = document.getElementById('pixelGirl');
  if(!g) return;
  let shadow = [];
  art.forEach((row,y)=>{[...row].forEach((ch,x)=>{const c=P[ch];if(c)shadow.push(`${(x+1)*6}px ${(y+1)*6}px 0 0 ${c}`);});});

/* ---------- 3. Profile（成长系统） ---------- */
/* Level 公式: XP = level*200 + 240*(level-1)  即 Lv1 起步，Lv.N 需要 N*200+240*(N-1) = 440N - 240 */
const Profile = {
  DEFAULT(){ return {
    xp: 10400,              /* 种子：Lv.7，距 Lv.8 还差 240 XP（7 级累计 7800 + 当前 2600 = 10400） */
    streak: 12,
    lastCheckIn: '',       /* yyyy-m-d 当天完成打卡的日期 */
    goalMin: 15,
    todaySec: 0,
    todayDate: today()
  }; },
  data(){
    // 版本 v2：若检测到老版本（旧 seed xp 太小或缺 v 字段），迁移到新 seed
    const meta = LS.get('meta', null);
    if(!meta || meta.v < 2){
      LS.set('profile', this.DEFAULT());
      LS.set('meta', { v:2 });
    }
    let d = LS.get('profile', null);
    if(!d){ d = this.DEFAULT(); LS.set('profile', d); }
    // 字段补齐
    d.xp = d.xp ?? this.DEFAULT().xp; d.streak = d.streak ?? this.DEFAULT().streak;
    d.lastCheckIn = d.lastCheckIn ?? ''; d.goalMin = d.goalMin ?? 15;
    d.todaySec = d.todaySec ?? 0; d.todayDate = d.todayDate ?? today();
    LS.set('profile', d);
    // 日切换：清理 todaySec；若昨天未完成 goal，streak 不动
    if(d.todayDate !== today()){
      d.todayDate = today();
      d.todaySec = 0;
      LS.set('profile', d);
    }
    return d;
  },
  save(){ LS.set('profile', this.data()); },
  // 当前等级 & 下一等级所需 XP
  level(){
    let d=this.data();
    let lv=1; let xpAcc=0;
    while(true){
      const need = lv*200 + 240*(lv-1);  // 到下一等级需要的累计 XP
      if(d.xp < xpAcc + need) break;
      xpAcc += need; lv++;
    }
    return { lv, curInLv: d.xp - xpAcc, need: lv*200 + 240*(lv-1), xpTotal: d.xp };
  },
  addXP(n){
    const d=this.data(); d.xp += n; LS.set('profile', d);
    // 升级 toast
    const lvInfo=this.level();
    if(lvInfo.curInLv === 0){ toast(`🎉 升级到 Lv.${lvInfo.lv}！`); }
    return lvInfo;
  },
  addSec(sec){
    const d=this.data(); d.todaySec += sec; LS.set('profile', d);
    // 达到目标时，若今日未打卡则连续打卡+1
    if(d.todaySec >= d.goalMin*60 && d.lastCheckIn !== today()){
      d.streak += 1; d.lastCheckIn = today(); LS.set('profile', d);
      toast(`🔥 今日目标达成！连续打卡 ${d.streak} 天`);
    }
  },
  // 手动打卡（对"没到时间但完整完成一轮复习/挑战"的补偿）
  checkInOnce(){
    const d=this.data();
    if(d.lastCheckIn !== today()){ d.streak += 1; d.lastCheckIn = today(); LS.set('profile', d); toast(`🔥 打卡 +1，连续 ${d.streak} 天`); }
  },
  reset(){ LS.del('profile'); LS.del('words'); LS.del('sentences'); LS.del('fav'); LS.del('hist'); LS.del('topics'); LS.del('lastTopic'); toast('已重置所有进度'); location.hash='home'; }
};

/* ---------- 6. 语音引擎 ---------- */
const Speech = {
  avail: false,
  recogAvail: false,
  recog: null,
  voiceEn: null,
  _init(){
    this.avail = !!window.speechSynthesis;
    this.recogAvail = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    if(this.avail){
      const pick = ()=>{
        const vs = speechSynthesis.getVoices();
        this.voiceEn = vs.find(v=>/en-US|en-GB|Google US|Samantha|Karen/i.test(v.lang+v.name)) || vs.find(v=>v.lang.startsWith('en')) || vs[0];
      };
      pick(); if(speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = pick;
    }
    if(this.recogAvail){
      const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
      this.recog = new Ctor();
      this.recog.lang = 'en-US';
      this.recog.interimResults = true;
      this.recog.continuous = false;
    }
  },
  speak(text, {rate=1.0, pitch=1.0}={}){
    return new Promise((resolve)=>{
      if(!this.avail){ resolve(); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if(this.voiceEn) u.voice = this.voiceEn;
      u.rate = rate; u.pitch = pitch; u.lang = 'en-US';
      u.onend = u.onerror = ()=>resolve();
      speechSynthesis.speak(u);
    });
  },
  /* 开始听：实时 interim 回调 + final 回调 + onError + stop 函数返回 */
  listen({onInterim=()=>{}, onFinal=()=>{}, onError=()=>{}, maxMs=15000}={}){
    if(!this.recogAvail){ onError('no-api'); return ()=>{}; }
    let stopped=false;
    this.recog.onresult = (ev)=>{
      let fin='', inter='';
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const t = ev.results[i][0].transcript;
        if(ev.results[i].isFinal) fin += t; else inter += t;
      }
      if(fin) onFinal(fin.trim());
      else if(inter) onInterim(inter.trim());
    };
    this.recog.onerror = (e)=>{ if(!stopped) onError(e.error||'unknown'); };
    this.recog.onend = ()=>{ stopped=true; };
    try { this.recog.start(); } catch(e){ onError('already-started?'); }
    // 超时自动停
    const timer = setTimeout(()=>{ try{ this.recog.stop(); }catch{} }, maxMs);
    return ()=>{ clearTimeout(timer); try{ this.recog.stop(); }catch{} };
  },
  /* 文本相似度：词级匹配，返回 {score, details} */
  similarity(target, heard){
    const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9'\s]/g,'').replace(/\s+/g,' ').trim();
    const t = norm(target).split(' ').filter(Boolean);
    const h = norm(heard).split(' ').filter(Boolean);
    // 按 LCS 对齐 target 中每个词
    const dp = Array.from({length:t.length+1},()=>new Array(h.length+1).fill(0));
    for(let i=1;i<=t.length;i++) for(let j=1;j<=h.length;j++){
      const sim = (a,b)=>{ if(a===b)return 2; if(lev(a,b)<=1)return 1; return 0; };
      dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]+sim(t[i-1],h[j-1]));
    }
    // 回溯：给每个 target 词分配 hit/miss/partial
    const details = new Array(t.length).fill(0); // 2=hit,1=partial,0=miss
    let i=t.length, j=h.length;
    while(i>0 && j>0){
      if(t[i-1]===h[j-1]){ details[i-1]=2; i--; j--; }
      else if(lev(t[i-1],h[j-1])<=1){ details[i-1]=1; i--; j--; }
      else if(dp[i-1][j]>=dp[i][j-1]) i--; else j--;
    }
    // 匹配得分 + 长度惩罚
    const hitWords = details.filter(d=>d===2).length;
    const partial = details.filter(d=>d===1).length;
    const score = Math.round( (hitWords*2 + partial*1) / Math.max(1, t.length*2) * 100 );
    const detailsArr = t.map((w,idx)=>({word:w, ok:details[idx]}));
    return { score, details: detailsArr, heard: h.join(' '), target: t.join(' ') };
  }
};
function lev(a,b){ if(a===b)return 0; if(!a)return b.length; if(!b)return a.length; const m=lev(a.slice(1),b); const n=lev(a,b.slice(1)); if(a[0]===b[0])return Math.min(m,n,lev(a.slice(1),b.slice(1))); return 1+Math.min(m,n,lev(a.slice(1),b.slice(1))); }
Speech._init();

  $('#sLevel').textContent = `Lv.${lv.lv}`;
  $('#sXpRemain').textContent = `距 Lv.${lv.lv+1} 还差 ${lv.need - lv.curInLv} XP`;
  $('#sXpBar').style.width = Math.round(lv.curInLv/lv.need*100)+'%';

  $('#sGoal').textContent = `${minDone}/${p.goalMin} 分`;

    <div class="px-card topic press" data-toast="进入「${t.name}」练习">

      <div class="pic ${t.cls}">${t.icon}</div>

      <div class="stars">${t.stars}</div>

    const topic = cur[idx];

  };

  $('#shuffleBtn').onclick = ()=>{
    const pool = [...TOPICS].sort(()=>Math.random()-.5);
    LS.set('topics', pool);
    toast('已换 3 个新主题');
    renderHome();
  };

  // 复习队列长度
  const due = SRS.allDueCount();
  $('#reviewCount').textContent = due>0 ? `今日待复习：${due} 项` : '今日复习完成 ✅';

  // 历史（最近 2 条）
  const list = Hist.list().slice(0,2);
  if(list.length===0){
    $('#historyWrap').innerHTML = `<div class="empty-center">还没有训练记录，开始第一课吧！</div>`;
  } else {
    $('#historyWrap').innerHTML = list.map(r=>{
      const topic = TOPICS.find(t=>t.id===r.topic) || {icon:'📖', name:'自由练习'};
      return `<div class="px-card rec press" data-toast="训练详情">
        <span class="r-ic">${topic.icon}</span>
        <div class="r-mid"><b>${fmtDate(r.date)} · ${topic.name}</b><span>时长 ${r.minutes} 分 · ${'★'.repeat(Math.round(r.stars||4))}${'☆'.repeat(5-Math.round(r.stars||4))} · XP +${r.xp||0}</span></div>
        <span class="xp">+${r.xp||0}</span>
      </div>`;
    }).join('');
  }

  // 全局计时（当首页可见时累加今天秒数）
  if(!renderHome._running){
    renderHome._running = setInterval(()=>{
      Profile.addSec(5);
      // 只更新看板数字，不刷新整个首页避免闪烁
      const pp = Profile.data();
      $('#sGoal').textContent = `${(pp.todaySec/60)|0}/${pp.goalMin} 分`;
      $('#sGoalBar').style.width = Math.min(100, Math.round(pp.todaySec/(pp.goalMin*60)*100))+'%';
    }, 5000);
  }
}

// 自由对话：脚本驱动，目标句高亮，语音听辨挑战
function renderChat(topicId){
  LS.set('lastTopic', topicId);
  const script = CHAT_SCRIPTS[topicId] || CHAT_SCRIPTS.restaurant;
  $('#chatTitle').textContent = `自由对话 · ${TOPICS.find(t=>t.id===topicId)?.name||'餐厅'}`;
  $('#chatTopicBtn').onclick = ()=> location.hash = 'practice?topic=' + topicId;

  // 读 idx 并做边界裁剪（防止历史残留值越界）
  let idx = (LS.get(`chat:${topicId}`, { idx:0 }) || {}).idx || 0;
  if(!script.lines || script.lines.length===0){ toast('该主题暂无对话脚本'); location.hash='home'; return; }
  idx = Math.min(Math.max(idx, 0), script.lines.length - 1);
  const scroll = $('#chatScroll');
  const addMsg = (who, en, zh='', score=null, details=null)=>{
    const bubble = `<div class="bubble">${en}</div>` + (zh?`<div class="zh-hint">${zh}</div>`:'') + (score!=null?`<div class="score-tag" style="margin-top:4px;font-weight:900;color:${score>=80?'#2ecc71':score>=60?'#f5c542':'#e85d5d'}">${score} 分</div>`:'');
    const node = document.createElement('div');
    node.className = 'chat-msg ' + (who==='me'?'me':'you');
    node.innerHTML = `<span class="av">${who==='me'?'🧑':'👩‍🍳'}</span>${bubble}`;
    scroll.appendChild(node);
    scroll.scrollTop = scroll.scrollHeight;
    // 逐词高亮
    if(details && node){
      const b = node.querySelector('.bubble');
      if(b){
        // 只对 "me" 消息的高分句做高亮标记（已渲染过就覆盖）
        b.innerHTML = en.split(/\s+/).map((w,i)=>{
          const hit = details[i];
          if(!hit) return `<span>${w}</span>`;
          if(hit.ok===2) return `<span class="word hit">${w}</span>`;
          if(hit.ok===1) return `<span class="word partial">${w}</span>`;
          return `<span class="word miss">${w}</span>`;
        }).join(' ');
      }
    }
  };

  function flushProgress(){
    LS.set(`chat:${topicId}`, { idx });
  }
  function advance(){
    if(!script.lines[idx]){ idx = 0; flushProgress(); scroll.innerHTML=''; sayIntro(); return; }
    if(idx >= script.lines.length){
      // 一轮结束
      const xp = 80;
      const stars = 4.5;
      Profile.addXP(xp);
      Hist.add({ topic: topicId, minutes: 4, stars, xp });
      toast(`🎉 完成一轮对话！+${xp} XP`);
      idx = 0; flushProgress();
      // 清空重新开始
      scroll.innerHTML = `<div class="empty-center">🎊 对话结束！再来一轮吧</div>`;
      setTimeout(()=>{ scroll.innerHTML=''; sayIntro(); }, 1500);
      return;
    }
    const turn = script.lines[idx];
    if(turn.you){
      addMsg('you', turn.you, turn.zh);
      Speech.speak(turn.you);
      idx++; flushProgress();
      // 等用户输入 / 语音
    } else if(turn.me){
      addMsg('me', '(请用语音或输入回答)', '你需要说：' + turn.me);
      // 让用户挑战
      const wait = ()=>{
        // 等用户回答（点击语音或回车）
      };
    }
  }

  function sayIntro(){
    scroll.innerHTML = `<div class="empty-center">${script.intro}</div>`;
    setTimeout(()=>{ scroll.innerHTML=''; advance(); }, 1200);
  }

  sayIntro();

  // 输入框回车发送 → 当作用户用文本回答
  const input = $('#chatInput');
  input.onkeydown = async (e)=>{
    if(e.key !== 'Enter') return;
    const val = input.value.trim(); if(!val) return;
    input.value = '';
    await handleUserUtterance(val);
  };

  // 语音按钮
  const micBtn = $('#chatMicBtn');
  let stopListen = null;
  micBtn.onclick = ()=>{
    if(stopListen){ stopListen(); stopListen=null; micBtn.textContent='🎤 语音'; micBtn.classList.remove('rec'); return; }
    if(!Speech.recogAvail){ toast('此浏览器不支持语音识别，请用键盘输入'); return; }
    micBtn.classList.add('rec'); micBtn.textContent='🔴 录音中…';
    let heard = '';
    stopListen = Speech.listen({
      onInterim(t){ heard = t; input.value = t; },
      onFinal: async (t)=>{ stopListen(); stopListen=null; micBtn.classList.remove('rec'); micBtn.textContent='🎤 语音'; await handleUserUtterance(t); },
      onError: (e)=>{ stopListen(); stopListen=null; micBtn.classList.remove('rec'); micBtn.textContent='🎤 语音'; toast('识别出错：'+(e==='not-allowed'?'请允许麦克风权限':e)); }
    });
    // 自动在 8 秒后停
    setTimeout(()=>{ if(stopListen){ stopListen(); stopListen=null; micBtn.classList.remove('rec'); micBtn.textContent='🎤 语音'; } }, 9000);
  };

  // 用户说完（文本 or 语音）→ 检查是否匹配当前 "me" 目标句
  async function handleUserUtterance(text){
    // 找到第一个待处理的 me
    while(idx < script.lines.length && script.lines[idx] && !script.lines[idx].me) idx++;
    if(idx >= script.lines.length || !script.lines[idx]){ idx=0; flushProgress(); scroll.innerHTML=''; sayIntro(); return; }
    const turn = script.lines[idx];
    addMsg('me', text, '🎯 目标：' + turn.me);
    const res = Speech.similarity(turn.me, text);
    // 覆盖刚加的 me 消息 → 高亮
    const lastMe = [...scroll.querySelectorAll('.chat-msg.me')].slice(-1)[0];
    if(lastMe){
      const b = lastMe.querySelector('.bubble');
      b.innerHTML = res.target.split(' ').map((w,i)=>{
        const d = res.details.find(x=>x.word===w);
        if(!d) return `<span>${w}</span>`;
        if(d.ok===2) return `<span class="word hit">${w}</span>`;
        if(d.ok===1) return `<span class="word partial">${w}</span>`;
        return `<span class="word miss">${w}</span>`;
      }).join(' ');
      const zhEl = lastMe.querySelector('.zh-hint'); if(zhEl) zhEl.textContent = `🎯 原目标：${turn.me}`;
      const scoreEl = lastMe.querySelector('.score-tag');
      if(scoreEl) scoreEl.textContent = `⭐ 匹配分：${res.score}/100`;
      else {
        const node = document.createElement('div');
        node.className='score-tag';
        node.style.marginTop='4px';
        node.style.fontWeight='900';
        node.style.color = res.score>=80?'#2ecc71':res.score>=60?'#f5c542':'#e85d5d';
        node.textContent = `⭐ 匹配分：${res.score}/100`;
        lastMe.appendChild(node);
      }
    }
    const xpAdd = Math.round(res.score/10);
    Profile.addXP(xpAdd);
    // AI 侧继续（不真 LLM，用"下一句 you"推进）
    idx++; flushProgress();
    await new Promise(r=>setTimeout(r, 700));
    advance();
  }
}

// 练习页：主题句列表，每条可 TTS + 听 + 打分
function renderPractice(topicId){
  LS.set('lastTopic', topicId);
  const topic = TOPICS.find(t=>t.id===topicId) || TOPICS[0];
  $('#pracTopicLabel').textContent = topic.name;
  const list = $('#pracList');
  // 用 LS 存每个句子上次最高分
  const scores = LS.get('practiceScores', {});
  list.innerHTML = topic.sentences.map((en,i)=>{
    const key = topicId + ':' + i;
    const last = scores[key];
    return `<div class="prac-item px-card">
      <div class="zh">${['餐厅','工作','旅行','咖啡','面试','机场','酒店','购物','问路'][TOPICS.findIndex(x=>x.id===topicId)]}主题 · 第${i+1}句</div>
      <div class="en" id="en-${key}">${en}</div>
      <div class="act">
        <button class="btn play" data-play="${en}">▶ 听一遍</button>
        <button class="btn primary" data-record="${key}">🎤 跟读打分</button>
        <button class="btn" data-manual="${key}" style="background:#fff;">✍️ 手动输入</button>
      </div>
      <div class="score-tag">上次最高分：${last?last+'/100':'暂无'}</div>
      <div id="res-${key}" style="margin-top:6px;"></div>
    </div>`;
  }).join('');

  // 点击事件
  list.onclick = (e)=>{
    const p = e.target.closest('[data-play]');
    if(p){ Speech.speak(p.dataset.play); return; }
    const r = e.target.closest('[data-record]');
    if(r){ doRecord(r.dataset.record); return; }
    const m = e.target.closest('[data-manual]');
    if(m){ doManual(m.dataset.record); return; }
  };

  function doRecord(key){
    if(!Speech.recogAvail){ toast('浏览器不支持语音识别，可点「手动输入」或换 Chrome/Edge'); return; }
    const en = $('#en-'+key).textContent;
    const btn = list.querySelector(`[data-record="${key}"]`);
    btn.textContent='🔴 录音中…'; btn.classList.add('rec');
    let heard='';
    const stop = Speech.listen({
      onInterim(t){ heard=t; $('#res-'+key).innerHTML = `<div class="transcript interim">${t}</div>`; },
      onFinal: (t)=>{
        btn.textContent='🎤 跟读打分'; btn.classList.remove('rec');
        heard = t; $('#res-'+key).innerHTML = `<div class="transcript">你说：${heard}</div>`;
        applyScore(key, en, heard);
      },
      onError: (err)=>{
        btn.textContent='🎤 跟读打分'; btn.classList.remove('rec');
        toast('识别失败：'+(err==='not-allowed'?'请允许麦克风':err));
      }
    });
    setTimeout(()=>{ if(stop){ stop(); btn.textContent='🎤 跟读打分'; btn.classList.remove('rec'); } }, 10000);
  }
  function doManual(key){
    const en = $('#en-'+key).textContent;
    const val = prompt('请输入你想说的（或粘贴你听到的内容）：', '');
    if(val==null || !val.trim()) return;
    applyScore(key, en, val.trim());
  }
  function applyScore(key, target, heard){
    const res = Speech.similarity(target, heard);
    // 渲染高亮
    const b = $('#en-'+key);
    b.innerHTML = target.split(' ').map((w,i)=>{
      const d = res.details[i];
      if(!d) return `<span>${w}</span>`;
      if(d.ok===2) return `<span class="word hit">${w}</span>`;
      if(d.ok===1) return `<span class="word partial">${w}</span>`;
      return `<span class="word miss">${w}</span>`;
    }).join(' ');
    const color = res.score>=80?'#2ecc71':res.score>=60?'#f5c542':'#e85d5d';
    const bar = res.score>=80?'#2ecc71':res.score>=60?'#f5c542':'#e85d5d';
    $('#res-'+key).innerHTML = `
      <div class="score-text" style="color:${color};">${res.score} 分</div>
      <div class="score-bar"><div style="width:${res.score}%;background:${bar};"></div></div>
      <div style="margin-top:4px;font-size:12px;color:var(--ink2);">你说：${res.heard||'(空)'}｜目标：${res.target}</div>`;
    // 分数写入
    const scores = LS.get('practiceScores', {});
    if(!scores[key] || scores[key] < res.score) scores[key] = res.score;
    LS.set('practiceScores', scores);
    const xpAdd = Math.round(res.score/2);
    Profile.addXP(xpAdd);
    // 加入复习池（低分句进入 SRS）
    if(res.score < 70){
      const sentArr = LS.get('sentences', []);
      const zh = topic.intro;
      if(!sentArr.find(s=>s.en===target)){
        sentArr.push({id:genId(), en:target, zh: topic.intro, reps:0, ease:1, dueDate: today(), lastSeen:''});
        LS.set('sentences', sentArr);
      }
    }
  }

  // 主题选择
  $('#pracTopicSelect').onclick = ()=>{
    const name = prompt('输入主题编号（0 餐厅/1 工作/2 旅行/3 咖啡/4 面试/5 机场/6 酒店/7 购物/8 问路）：', TOPICS.findIndex(t=>t.id===topicId));
    if(name==null) return;
    const n = parseInt(name); if(isNaN(n)||n<0||n>=TOPICS.length) return toast('编号无效');
    location.hash = 'practice?topic=' + TOPICS[n].id;
  };
}

// 复习页
let reviewState = null;
function renderReview(){
  SRS.initIfEmpty();
  const items = SRS.dueItems(13);
  $('#reviewRight').textContent = items.length ? `${items.length} 项待复习` : '全部完成';
  if(items.length===0){
    $('#reviewWrap').innerHTML = `<div class="empty-center" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;">
      🎉 今日所有复习已完成！<br><br>去「自由对话」或「练习」页继续吧～
      <div style="margin-top:20px;"><button class="btn play press" data-hash="chat" style="display:inline-block;">🎤 开始对话</button></div>
    </div>`;
    return;
  }
  if(!reviewState || reviewState.items !== items.length){ reviewState = { idx:0, items, scoreTotal:0, xpGained:0 }; }
  showItem();

  function showItem(){
    const rw = $('#reviewWrap');
    const it = items[reviewState.idx];
    const pct = Math.round((reviewState.idx)/items.length*100);
    rw.innerHTML = `<div class="review-progress">复习 ${reviewState.idx+1} / ${items.length}  &nbsp;·&nbsp;  ${pct}%</div>
      <div class="score-bar" style="margin-bottom:10px;"><div style="width:${pct}%;background:#f4679d;"></div></div>
      <div class="px-card card-en review-card">
        <div class="zh">${it.zh} · ${it.kind==='word'?'单词':'句子'}</div>
        <div class="en" id="revEn">${it.en}</div>
        <div class="action-row">
          <button class="btn play" id="revPlay">▶ 听</button>
          <button class="btn primary" id="revRec">🎤 回忆</button>
          <button class="btn" id="revSkip">🙈 跳过</button>
        </div>
        <div id="revRes" style="margin-top:10px;"></div>
      </div>
      <div class="action-row" style="margin-top:10px;">
        <button class="btn" id="revShow">👀 看原文重读</button>
      </div>`;
    $('#revPlay').onclick = ()=> Speech.speak(it.en);
    $('#revShow').onclick = ()=> $('#revEn').textContent = it.en;
    $('#revSkip').onclick = ()=>{ SRS.grade(it.id, it.kind, false); next(); };
    $('#revRec').onclick = ()=>{
      if(!Speech.recogAvail){ toast('浏览器不支持识别，点击「跳过」继续'); return; }
      const btn = $('#revRec'); btn.textContent='🔴'; btn.classList.add('rec');
      let heard='';
      const stop = Speech.listen({
        onInterim(t){ heard=t; $('#revRes').innerHTML = `<div class="transcript interim">${t}</div>`; },
        onFinal: (t)=>{
          btn.textContent='🎤 回忆'; btn.classList.remove('rec');
          applyRecall(t);
        },
        onError: (e)=>{ btn.textContent='🎤 回忆'; btn.classList.remove('rec'); toast('识别失败'); }
      });
      setTimeout(()=>{ if(stop){ stop(); btn.textContent='🎤 回忆'; btn.classList.remove('rec'); applyRecall(heard); } }, 8000);
    };

    function applyRecall(text){
      const res = Speech.similarity(it.en, text);
      const ok = res.score >= 70;
      SRS.grade(it.id, it.kind, ok);
      const xpAdd = Math.round(res.score/3);
      Profile.addXP(xpAdd); reviewState.xpGained += xpAdd; reviewState.scoreTotal += res.score;
      $('#revEn').innerHTML = it.en.split(' ').map((w,i)=>{
        const d = res.details[i];
        if(!d) return `<span>${w}</span>`;
        if(d.ok===2) return `<span class="word hit">${w}</span>`;
        if(d.ok===1) return `<span class="word partial">${w}</span>`;
        return `<span class="word miss">${w}</span>`;
      }).join(' ');
      $('#revRes').innerHTML = `
        <div class="score-text ${res.score>=80?'high':res.score>=60?'mid':'low'}">${res.score}/100</div>
        <div style="text-align:center;font-size:12px;color:var(--ink2);">${ok?'✅ 已记住，间隔拉长':'❌ 还要再记一次，明天再来'} · XP +${xpAdd}</div>
        <div class="action-row" style="margin-top:10px;">
          <button class="btn" id="revNext">${reviewState.idx<items.length-1?'下一个 ▸':'完成复习 🎉'}</button>
        </div>`;
      $('#revNext').onclick = ()=>next();
      // 听一遍正确发音
      Speech.speak(it.en);
    }

    function next(){
      reviewState.idx++;
      if(reviewState.idx >= items.length){ finish(); return; }
      showItem();
    }
    function finish(){
      const avg = Math.round(reviewState.scoreTotal / items.length);
      Profile.checkInOnce();
      const mins = Math.max(3, Math.round(items.length * 0.25));
      Profile.addSec(mins*60);
      Hist.add({ topic: 'review', minutes: mins, stars: avg>=80?4.5:avg>=60?3.5:2.5, xp: reviewState.xpGained, note: `${items.length} 项 SRS 复习，平均 ${avg} 分` });
      toast(`🎊 复习完成！+${reviewState.xpGained} XP · 平均 ${avg} 分`);
      reviewState = null;
      renderReview();
    }
  }
}

function renderHist(){

  const totalMin = list.reduce((a,b)=>a + (b.minutes||0),0);
  const totalXp = list.reduce((a,b)=>a + (b.xp||0),0);

  if(list.length===0){

  }
  $('#histWrap').innerHTML = `<div class="prac-list">${list.map(r=>{
    const topic = TOPICS.find(t=>t.id===r.topic) || {icon:'📖', name:'自由练习'};
    return `<div class="px-card rec press">
      <span class="r-ic">${topic.icon}</span>
      <div class="r-mid"><b>${fmtDate(r.date)} · ${topic.name}</b><span>时长 ${r.minutes} 分 · ${'★'.repeat(Math.round(r.stars||4))}${'☆'.repeat(5-Math.round(r.stars||4))}${r.note?' · '+r.note:''}</span></div>
      <span class="xp">+${r.xp||0}</span>
    </div>`;
  }).join('')}</div>`;
}

// 生成训练材料（模板化 — 因为没有真实 LLM）
function renderGen(){
  const wrap = $('#genWrap');
  const tabs = ['dialogue','story','speech','scene'];
  const tabNames = {dialogue:'双人对话',story:'短故事',speech:'一分钟演讲',scene:'场景练习'};
  const data = {
    dialogue: [
      {title:'机场相遇', a:"Hey, long time no see! Where have you been?", b:"Traveling for work mostly. How about you?"},
      {title:'咖啡店讨论项目', a:"Did you see the latest report?", b:"Yes. I think we should schedule a meeting."}
    ],
    story: [
      {title:'A Sunny Morning', text:'One Saturday morning, Tom woke up early. He looked out the window and saw blue sky. He decided to go to the park with his dog. They ran together for an hour.'},
      {title:'Lost in Tokyo', text:'I got off at the wrong subway station. Luckily, a kind student showed me the way with her phone. We became friends that day.'}
    ],
    speech: [
      {title:'One Minute About My Hometown', text:'My hometown is a small town near the mountains. Air is fresh, people are friendly. I grew up there, and every summer I go back to visit my grandparents.'},
      {title:'Why Learn English', text:'English opens doors. You can travel alone, read original books, and talk to people from all over the world. It is not easy, but every minute pays off.'}
    ],
    scene: [
      {title:'在诊所预约', text:"Hello, I'd like to make an appointment with Dr. Li. Is she free this afternoon?"},
      {title:'和房东沟通', text:'The heater does not work in my room. Could you send someone to fix it tomorrow?'}
    ]
  };
  wrap.innerHTML = `
    <div class="gen-tabs">${tabs.map(t=>`<button class="btn ${t==='dialogue'?'on':''} press" data-gen="${t}">${tabNames[t]}</button>`).join('')}</div>
    <div id="genList"></div>
    <div style="margin-top:20px;font-size:11px;color:#8a7460;text-align:center;">注：接入 AI 大模型后可一键生成无限量材料（D 升级阶段）</div>
  `;
  function renderList(tab){
    const items = data[tab];
    $('#genList').innerHTML = items.map((o,i)=>{
      let body='';
      if(tab==='dialogue') body = `<b>${o.title}</b><br>A: ${o.a}<br>B: ${o.b}`;
      else body = `<b>${o.title}</b><br>${o.text}`;
      return `<div class="px-card" style="padding:14px;margin-bottom:10px;font-size:13px;line-height:1.7;">
        <div>${body}</div>
        <div class="action-row" style="margin-top:10px;">
          <button class="btn play press" id="gp${tab}${i}">▶ 听</button>
          <button class="btn primary press" id="gr${tab}${i}">🎤 挑战跟读</button>
          <button class="btn press" data-copy="${(tab==='dialogue'?o.a+'\n'+o.b:o.text)}">📋 复制</button>
        </div>
      </div>`;
    }).join('');
    // 绑定播放 & 挑战
    items.forEach((o,i)=>{
      const txt = tab==='dialogue'? (o.a+' '+o.b) : o.text;
      const playBtn = $(`#gp${tab}${i}`); if(playBtn) playBtn.onclick = ()=> Speech.speak(txt);
      const chalBtn = $(`#gr${tab}${i}`); if(chalBtn) chalBtn.onclick = ()=>{
        const key = `gen-${tab}-${i}`;
        const val = prompt('请跟读上面那段内容，然后粘贴/直接输入：', '');
        if(!val) return;
        const res = Speech.similarity(txt, val);
        toast(`⭐ 匹配分：${res.score}/100`);
        Profile.addXP(Math.round(res.score/2));
      };
    });
  }
  renderList('dialogue');
  wrap.onclick = (e)=>{
    const t = e.target.closest('[data-gen]');
    if(t){ wrap.querySelectorAll('.btn').forEach(b=>b.classList.toggle('on', b.dataset.gen===t.dataset.gen)); renderList(t.dataset.gen); return; }
    const c = e.target.closest('[data-copy]');
    if(c){ navigator.clipboard?.writeText(c.dataset.copy).then(()=>toast('已复制')); }
  };
}
