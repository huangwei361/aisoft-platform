<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品目录 · AI业务应用软件开发公司</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:#2b3445;
    background:#f4f6fb; min-height:100vh;
  }
  .topbar{
    background:#fff; border-bottom:1px solid #e6e9f2; padding:14px 24px;
    display:flex; align-items:center; gap:16px;
  }
  .topbar .logo{ font-weight:900; letter-spacing:1px; color:#2f5cff; }
  .topbar a{ color:#5b6478; text-decoration:none; font-size:14px; }
  .topbar a:hover{ color:#2f5cff; }
  .wrap{ max-width:960px; margin:0 auto; padding:28px 20px 60px; }
  .cover{
    border-radius:16px; padding:36px 32px; color:#fff; position:relative; overflow:hidden;
    box-shadow:0 10px 30px rgba(47,92,255,.15);
  }
  .cover .cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,16,32,.62),rgba(10,16,32,.24));z-index:1}
  .cover .badge,.cover .cat,.cover h1,.cover p{position:relative;z-index:2}
  .cover .badge{
    position:absolute; top:20px; right:20px; background:rgba(255,255,255,.2);
    border:1px solid rgba(255,255,255,.45); padding:4px 12px; border-radius:999px; font-size:12px;
  }
  .cover .cat{ font-size:13px; opacity:.85; letter-spacing:2px; }
  .cover h1{ font-size:30px; margin:8px 0 12px; letter-spacing:1px; }
  .cover p{ font-size:15px; opacity:.92; line-height:1.7; max-width:640px; }
  .grid{ display:grid; grid-template-columns:1fr 320px; gap:20px; margin-top:20px; }
  @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:#fff; border-radius:14px; padding:24px; box-shadow:0 4px 16px rgba(30,40,70,.06); }
  .card h3{ font-size:17px; margin-bottom:14px; color:#1c2333; }
  .feat{ list-style:none; }
  .feat li{ padding:9px 0 9px 26px; position:relative; font-size:14px; color:#3d475c; border-bottom:1px dashed #edf0f6; }
  .feat li:last-child{ border-bottom:none; }
  .feat li::before{ content:"✓"; position:absolute; left:2px; color:#2f5cff; font-weight:900; }
  .tags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .tag{ background:#eef2ff; color:#2f5cff; font-size:12px; padding:4px 10px; border-radius:6px; }
  .price b{ font-size:30px; color:#e8608a; }
  .price span{ color:#8a93a8; font-size:13px; }
  .price-note{ font-size:13px; color:#5b6478; margin-top:6px; }
  .btns{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .btn{
    display:block; text-align:center; padding:12px; border-radius:10px; text-decoration:none;
    font-size:15px; font-weight:700; cursor:pointer; border:none; transition:.15s;
  }
  .btn-primary{ background:linear-gradient(135deg,#2f5cff,#7c3aed); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:#eef2ff; color:#2f5cff; }
  .btn-ghost:hover{ background:#e2e9ff; }
  .kv{ display:flex; justify-content:space-between; padding:8px 0; font-size:13px; border-bottom:1px dashed #edf0f6; }
  .kv:last-child{ border-bottom:none; }
  .kv span{ color:#8a93a8; } .kv b{ color:#2b3445; }
  .note{ margin-top:20px; text-align:center; font-size:12px; color:#a0a8bc; }
  .empty-tip{ padding:60px 20px; text-align:center; color:#8a93a8; }
</style>
</head>
<body>
  <div class="topbar">
    <span class="logo">AI业务应用软件开发公司</span>
    <a href="../../index.html">首页</a>
    <a href="../../apps.html">应用广场</a>
    <a href="../../demands.html">需求广场</a>
    <a href="../../mall.html">商城广场</a>
  </div>
  <div class="wrap" id="app"></div>
  <script src="../../assets/data.js"></script>
  <script>
    /* 从 URL 目录名识别产品：/products/目录名/ → 取 products 后一段（兼容 index.html 结尾） */
    const seg = location.pathname.split('/').filter(Boolean);
    const pi = seg.indexOf('products');
    let dir = '像素英语口语练习';
    if (pi >= 0) {
      const rest = seg.slice(pi + 1).filter(s => s !== 'index.html');
      if (rest.length) dir = rest[0];
    }
    try { dir = decodeURIComponent(dir); } catch (e) {}
    const a = (window.APPS || []).find(x => x.name === dir || x.id === dir);
    const root = document.getElementById('app');

    if (!a) {
      root.innerHTML = '<div class="empty-tip"><b>产品不存在或已下架</b><br><br><a href="../../apps.html">← 返回应用广场</a></div>';
    } else {
      const demoBtn = a.demo
        ? `<a class="btn btn-ghost" href="../../${a.demo}" target="_blank" rel="noopener">▶ 打开在线演示版</a>`
        : `<a class="btn btn-ghost" href="../../apps.html">查看更多官方应用</a>`;
      root.innerHTML = `
        <div class="cover" style="background:linear-gradient(135deg,${a.colors[0]},${a.colors[1]})">
          ${a.img ? `<img class="cover-img" src="../../${a.img}" alt="${a.name}" loading="lazy">` : ''}
          <span class="badge">${a.badge || '官方自营'}</span>
          <div class="cat">${a.catLabel} · 官方自研</div>
          <h1>${a.name}</h1>
          <p>${a.desc}</p>
        </div>
        <div class="grid">
          <div class="card">
            <h3>核心能力</h3>
            <ul class="feat">${a.features.map(f => `<li>${f}</li>`).join('')}</ul>
            <div class="tags">${a.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
          </div>
          <div class="card">
            <h3>订阅价格</h3>
            <div class="price"><b>${a.price ? '¥' + a.price.toLocaleString() : '面议'}</b><span>${a.price ? a.unit : ''}</span></div>
            <div class="price-note">${a.priceNote || '按规模与部署方式报价'}</div>
            <div class="btns">
              ${demoBtn}
              <a class="btn btn-primary" href="../../apps.html">在应用广场采购</a>
            </div>
            <div style="margin-top:18px">
              <div class="kv"><span>交付方式</span><b>私有化 / 混合云</b></div>
              <div class="kv"><span>实施周期</span><b>2–6 周（视场景）</b></div>
              <div class="kv"><span>服务内容</span><b>部署 + 培训 + 首年运维</b></div>
              <div class="kv"><span>用户评价</span><b>★ ${a.rating} / 5.0 · ${a.sales} 家采购</b></div>
            </div>
          </div>
        </div>
        <p class="note">演示环境：本页为产品目录示意，真实采购以合同与实施范围为准。</p>`;
      document.title = a.name + ' · 产品目录';
    }
  </script>
</body>
</html>
